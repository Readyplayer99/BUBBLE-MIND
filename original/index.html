<!doctype html>
<html lang='en' data-theme='dark'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content'>
<meta name='theme-color' content='#0a0e1a'>
<meta name='description' content='Bubble Mind - explore your ideas as floating bubbles.'>
<title>Bubble Mind</title>
<style>
:root{--bg:#0a0e1a;--bg2:#17204a;--fg:#eef2ff;--muted:#a3aed0;--panel:#151d3a;--line:rgba(255,255,255,.14);--accent:#7aa2ff}
[data-theme=light]{--bg:#f1f4ff;--bg2:#dfe6ff;--fg:#10162b;--muted:#4a5476;--panel:#ffffff;--line:rgba(0,0,0,.16);--accent:#3b5bdb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0}
#main{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 45%,var(--bg2) 0,var(--bg) 72%)}
.top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;z-index:5}
#crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow:hidden;white-space:nowrap}
.crumb{background:none;border:0;padding:10px 6px;min-height:44px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;color:var(--muted);border-radius:10px;display:inline-block;line-height:24px}
.crumb.current{color:var(--fg);font-weight:600;cursor:default}
.sep{color:var(--muted);opacity:.6}
.icon,.pill{min-width:44px;min-height:44px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 80%,transparent);border-radius:22px;padding:0 14px}
.icon{padding:0;font-size:20px}
.icon:disabled{opacity:.35}
.pill[aria-pressed=false]{opacity:.7}
.pill.small{min-height:40px;font-size:14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,.bubble:focus-visible .bubble__inner,.core:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none}
.layer{position:absolute;inset:0;touch-action:none;will-change:transform,opacity}
.layer.frozen{pointer-events:none}
.world{position:absolute;left:50%;top:50%;width:0;height:0;will-change:transform}
.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.bubble{position:absolute;left:0;top:0;border-radius:50%;cursor:pointer;touch-action:none;will-change:transform}
.bubble__inner{position:relative;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;padding:12%;text-align:center;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--c) 88%,#fff) 0,var(--c) 55%,color-mix(in srgb,var(--c) 78%,#000) 100%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 -10px 20px rgba(0,0,0,.18),inset 0 8px 16px rgba(255,255,255,.3),0 8px 26px color-mix(in srgb,var(--c) 38%,transparent);transition:transform .16s ease,box-shadow .16s ease}
.bubble.pop .bubble__inner{animation:pop .5s cubic-bezier(.2,1.25,.4,1) backwards;animation-delay:var(--d,0ms)}
.bubble__inner::after{content:'';position:absolute;left:20%;top:12%;width:34%;height:20%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,0));transform:rotate(-28deg);pointer-events:none}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.bubble.is-pressed .bubble__inner{transform:scale(.93)}
.bubble.is-dragging .bubble__inner{transform:scale(1.07);box-shadow:inset 0 -10px 20px rgba(0,0,0,.18),inset 0 8px 16px rgba(255,255,255,.3),0 18px 40px rgba(0,0,0,.4)}
.bubble.hl .bubble__inner{box-shadow:0 0 0 3px #fff,0 0 28px 6px color-mix(in srgb,var(--c) 70%,transparent)}
.bubble.linked .bubble__inner{box-shadow:0 0 0 3px rgba(255,255,255,.65),0 0 20px 3px color-mix(in srgb,var(--c) 55%,transparent)}
.badge{position:absolute;top:-6px;right:-6px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--panel);color:var(--fg);border:1px solid var(--line);font-size:12px;font-weight:700;display:grid;place-items:center;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.bubble__label,.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;line-height:1.15;pointer-events:none}
.bubble__label{font-size:var(--fs,16px);font-weight:650}
.bubble[data-tone=light] .bubble__label{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.bubble[data-tone=dark] .bubble__label{color:#0b1020}
.core{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;padding:16px;text-align:center;cursor:pointer;border:2px dashed color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--fg);font-size:14px;font-weight:600}
.conn path{fill:none;stroke-width:2.5;stroke-opacity:.8;stroke-linecap:round}
.conn polygon{stroke:none}
.conn text{font-size:13px;font-weight:600;fill:var(--fg);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.conn.hl path{stroke-width:4.5;stroke-opacity:1}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;pointer-events:none;z-index:2}
#begin{pointer-events:auto;width:min(210px,56vw);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.4);padding:20px;font-size:22px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.55),transparent 34%),radial-gradient(circle at 50% 55%,#6f8dff,#4a3fd0 75%,#2a2a85);box-shadow:inset 0 -14px 28px rgba(0,0,0,.25),0 0 60px 8px rgba(122,162,255,.35);animation:bob 7s ease-in-out infinite,glow 4.5s ease-in-out infinite}
[data-float=off] #begin{animation:glow 4.5s ease-in-out infinite}
#begin.tap{animation:tap .32s ease-out}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes glow{50%{box-shadow:inset 0 -14px 28px rgba(0,0,0,.25),0 0 84px 16px rgba(122,162,255,.5)}}
@keyframes tap{40%{transform:scale(.9)}100%{transform:scale(1.05)}}
.tagline{margin:0;color:var(--muted);font-size:17px;font-style:italic;text-align:center;padding:0 24px}
#ripple{position:absolute;display:none;border-radius:50%;pointer-events:none;z-index:3;background:radial-gradient(circle,transparent 55%,color-mix(in srgb,var(--c) 60%,transparent) 100%)}
#hint{position:absolute;left:50%;top:calc(50% + 100px);transform:translateX(-50%);margin:0;width:min(320px,80vw);text-align:center;color:var(--muted);pointer-events:none}
#status{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:13px;color:var(--muted);pointer-events:none;z-index:4}
#status.error{color:#ff8a8a;font-weight:600}
#tools{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:4;display:flex;gap:8px;align-items:center}
.fab{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,255,255,.4);font-size:34px;line-height:1;color:#fff;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.5),transparent 40%),linear-gradient(135deg,#6f8dff,#5a43d6);box-shadow:0 8px 24px rgba(60,70,200,.5);z-index:6}
.fab:active{transform:scale(.94)}
#overlay .backdrop{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,7,18,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .18s ease-out}
#overlay .backdrop.sheet{align-items:flex-end;padding:0}
.dialog{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:rise .22s ease-out}
.sheet .dialog{border-bottom-left-radius:0;border-bottom-right-radius:0;width:min(520px,100%);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.dialog h2{margin:0 0 12px;font-size:20px;overflow-wrap:anywhere}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.field{display:block;margin:0 0 14px;border:0;padding:0;min-width:0}
.field>span,.field legend{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;padding:0}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:color-mix(in srgb,var(--fg) 8%,transparent);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
textarea{resize:vertical}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:40px;height:40px;border-radius:50%;border:2px solid transparent;padding:0}
.swatch[aria-pressed=true]{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--panel)}
input.swatch.custom{background:none;border:2px solid var(--line);padding:2px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 20px;border-radius:23px;border:1px solid var(--line);background:transparent}
.btn.primary{background:linear-gradient(135deg,#6f8dff,#5a43d6);border-color:transparent;color:#fff;font-weight:600}
.btn.danger{background:#c43b3b;border-color:transparent;color:#fff;font-weight:600}
.btn:disabled{opacity:.5}
.err{color:#ff8a8a;min-height:1.2em;margin:0 0 6px;font-size:14px}
.menu{display:flex;flex-direction:column;gap:6px}
.menu .btn{text-align:left;border-radius:14px;width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{padding:0 14px;min-height:44px}
.seg .btn[aria-pressed=true]{background:var(--accent);color:#fff;border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.row input{width:26px;height:26px}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}
.list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;margin:8px 0}
.item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:transparent;min-height:48px}
.item small{color:var(--muted);overflow-wrap:anywhere}
.rowline{display:flex;align-items:center;gap:6px;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.rowline .t{min-width:0;flex:1;overflow-wrap:anywhere}.rowline .t small{display:block;color:var(--muted)}
.rowline .btn{min-height:40px;padding:0 12px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;max-width:min(92vw,460px)}
.toast{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);padding:10px 12px 10px 16px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:rise .2s ease-out}
.toast button{min-height:40px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:var(--accent);font-weight:700}
#banner{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 58px);z-index:40;background:#b3261e;color:#fff;padding:8px 12px;border-radius:12px;font-size:14px;text-align:center}
#selftest{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--fg);overflow:auto;padding:16px;font:14px/1.5 ui-monospace,Consolas,monospace;-webkit-user-select:text;user-select:text}
#selftest .pass{color:#5fd6a4}#selftest .fail{color:#ff8a8a;font-weight:700}
[data-motion=reduced] *,[data-motion=reduced] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
</style>
</head>
<body>
<div id='app'>
 <div id='main'>
  <header class='top'>
   <button id='backBtn' class='icon' aria-label='Back one level' hidden>&#8592;</button>
   <nav id='crumbs' aria-label='Breadcrumb'></nav>
   <button id='floatBtn' class='pill' type='button' aria-pressed='true'>Float: on</button>
   <button id='menuBtn' class='icon' type='button' aria-label='Menu' aria-haspopup='dialog'>&#8943;</button>
  </header>
  <div id='stage'>
   <div id='ripple'></div>
   <div id='empty' hidden>
    <button id='begin' type='button'>Begin an Idea</button>
    <p class='tagline'>Every universe begins with a thought.</p>
   </div>
   <p id='hint' hidden>Nothing inside yet. Tap + to add the first idea.</p>
   <div id='status' role='status' aria-live='polite'></div>
   <div id='tools'>
    <button id='undoBtn' class='icon' type='button' aria-label='Undo' disabled>&#8630;</button>
    <button id='redoBtn' class='icon' type='button' aria-label='Redo' disabled>&#8631;</button>
    <button id='recenter' class='pill small' type='button' hidden>Recenter</button>
   </div>
  </div>
  <button id='fab' class='fab' type='button' aria-label='New project'>+</button>
 </div>
 <div id='overlay'></div>
 <div id='toast' role='status' aria-live='polite'></div>
 <div id='banner' role='alert' hidden></div>
</div>
<script>
'use strict';
// <CORE>
const PALETTE=['#7aa2ff','#b58cff','#ff7eb6','#ff9f6b','#ffd166','#5fd6a4','#4fd1e8','#e86a6a'];
const DEFAULT_COLOUR=PALETTE[0], LINK_COLOUR='#9fb0d9';
const MAX_TITLE=200, BASE_RADIUS=46, HOME_SIZE=1.3, CORE_RADIUS=60, LAYOUT_GAP=28, GRID=60, UNDO_LIMIT=100;
const SIZES=[['Small',.8],['Medium',1],['Large',1.4]];
const DEFAULT_SETTINGS={key:'app',theme:'dark',floatingEnabled:true,reducedMotion:'system',defaultLayout:'freeform',gridSnap:false};

function newId(){
  const c=globalThis.crypto;
  if(c&&typeof c.randomUUID==='function')return c.randomUUID();
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function normaliseHex(input){
  const m=/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(input||'').trim());
  if(!m)return null;
  let x=m[1].toLowerCase();
  if(x.length===3)x=x.split('').map(c=>c+c).join('');
  return '#'+x;
}
function channel(v){const s=v/255;return s<=0.03928?s/12.92:Math.pow((s+0.055)/1.055,2.4)}
function luminance(hex){
  const h=normaliseHex(hex)||DEFAULT_COLOUR;
  return 0.2126*channel(parseInt(h.slice(1,3),16))+0.7152*channel(parseInt(h.slice(3,5),16))+0.0722*channel(parseInt(h.slice(5,7),16));
}
function contrastWith(hex){const L=luminance(hex);return{white:1.05/(L+0.05),black:(L+0.05)/0.05}}
function readableTone(hex){const c=contrastWith(hex);return c.white>=c.black?'light':'dark'}
const radiusFor=size=>BASE_RADIUS*Math.min(2.2,Math.max(0.6,size||1));
const snapTo=(v,g)=>Math.round(v/g)*g;

// First point on a deterministic outward spiral that overlaps nothing.
function findFreePosition(existing,r,gap=LAYOUT_GAP){
  const golden=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<20000;i++){
    const d=70*Math.sqrt(i),x=Math.round(d*Math.cos(i*golden)),y=Math.round(d*Math.sin(i*golden));
    let free=true;
    for(const c of existing){if(Math.hypot(c.x-x,c.y-y)<c.r+r+gap){free=false;break}}
    if(free)return{x,y};
  }
  return{x:existing.length*200,y:0};
}

// Pure layout engine: items [{id,r}] in creation order -> Map id->{x,y}. hasCore reserves room for the centre bubble.
function computeLayout(kind,items,hasCore){
  const out=new Map(),n=items.length;if(!n)return out;
  const maxR=Math.max(...items.map(i=>i.r)),cell=2*maxR+LAYOUT_GAP,R0=hasCore?CORE_RADIUS+maxR+LAYOUT_GAP:cell,rnd=Math.round;
  if(kind==='radial'){
    if(!hasCore&&n===1){out.set(items[0].id,{x:0,y:0});return out}
    let k=0,i=0;
    while(i<n){
      const rad=R0+k*cell,cap=Math.max(1,Math.floor(Math.PI/Math.asin(Math.min(1,cell/(2*rad)))));
      const cnt=Math.min(cap,n-i),off=-Math.PI/2+(k%2)*(Math.PI/cap);
      for(let j=0;j<cnt;j++){const a=off+j*2*Math.PI/cnt;out.set(items[i+j].id,{x:rnd(rad*Math.cos(a)),y:rnd(rad*Math.sin(a))})}
      i+=cnt;k++;
    }
  }else if(kind==='tree'){
    const cols=Math.max(1,Math.ceil(Math.sqrt(n*1.6))),rows=Math.ceil(n/cols);
    const y0=hasCore?R0:-((rows-1)*cell)/2;let i=0,row=0;
    while(i<n){const cnt=Math.min(cols,n-i);for(let j=0;j<cnt;j++)out.set(items[i+j].id,{x:rnd((j-(cnt-1)/2)*cell),y:rnd(y0+row*cell)});i+=cnt;row++}
  }else{ // grid
    let cells;
    for(let s=Math.ceil(Math.sqrt(n));;s++){
      cells=[];const o=(s-1)/2;
      for(let r=0;r<s;r++)for(let c=0;c<s;c++){const x=(c-o)*cell,y=(r-o)*cell;if(!hasCore||Math.hypot(x,y)>=R0)cells.push({x:rnd(x),y:rnd(y)})}
      if(cells.length>=n)break;
    }
    items.forEach((it,i)=>out.set(it.id,cells[i]));
  }
  return out;
}

function cleanTitle(t){const v=String(t==null?'':t).trim().slice(0,MAX_TITLE);if(!v)throw new Error('A title is required.');return v}
const cleanColour=c=>normaliseHex(c)||DEFAULT_COLOUR;
const cleanDesc=d=>String(d==null?'':d).trim().slice(0,5000);
const cleanLabel=l=>String(l==null?'':l).trim().slice(0,80);
const cleanSize=s=>{const n=Number(s);return Number.isFinite(n)&&n>0?Math.min(2.2,Math.max(.6,n)):1};
const byCreated=(a,b)=>a.createdAt-b.createdAt||(a.id<b.id?-1:1);

// ---------- storage back-ends: get / getAll / getByIndex / batch([{t,v}|{t,id,del:true}]) ----------
const TABLES=['projects','bubbles','settings','connections'];
class MemoryStore{
  constructor(){this.t={};for(const n of TABLES)this.t[n]=new Map()}
  async get(t,id){const v=this.t[t].get(id);return v?structuredClone(v):undefined}
  async getAll(t){return[...this.t[t].values()].map(v=>structuredClone(v))}
  async getByIndex(t,idx,key){return(await this.getAll(t)).filter(v=>v[idx]===key)}
  async batch(ops){
    for(const o of ops)if(!this.t[o.t])throw new Error('Unknown table '+o.t);
    for(const o of ops){if(o.del)this.t[o.t].delete(o.id);else this.t[o.t].set(o.t==='settings'?o.v.key:o.v.id,structuredClone(o.v))}
  }
  close(){}
}

class IdbStore{
  constructor(db){this.db=db}
  static open(name){
    return new Promise((res,rej)=>{
      if(typeof indexedDB==='undefined')return rej(new Error('IndexedDB is unavailable'));
      let r;
      try{r=indexedDB.open(name,2)}catch(e){return rej(e)}
      r.onupgradeneeded=ev=>{ // versioned migrations: each block only adds, never deletes user data
        const db=r.result,old=ev.oldVersion;
        if(old<1){
          db.createObjectStore('projects',{keyPath:'id'});
          const b=db.createObjectStore('bubbles',{keyPath:'id'});
          b.createIndex('parentId','parentId');b.createIndex('projectId','projectId');
          db.createObjectStore('settings',{keyPath:'key'});
        }
        if(old<2){
          const c=db.createObjectStore('connections',{keyPath:'id'});
          c.createIndex('sourceId','sourceId');c.createIndex('targetId','targetId');
        }
      };
      r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>db.close();res(new IdbStore(db))};
      r.onerror=()=>rej(r.error||new Error('Could not open storage'));
      r.onblocked=()=>rej(new Error('Storage is blocked by another tab'));
    });
  }
  _req(t,mode,fn){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction(t,mode);let out;
      const rq=fn(tx.objectStore(t));
      rq.onsuccess=()=>{out=rq.result};
      tx.oncomplete=()=>res(out);
      tx.onerror=()=>rej(tx.error);
      tx.onabort=()=>rej(tx.error||new Error('Storage transaction aborted'));
    });
  }
  get(t,id){return this._req(t,'readonly',s=>s.get(id))}
  getAll(t){return this._req(t,'readonly',s=>s.getAll())}
  getByIndex(t,idx,key){return this._req(t,'readonly',s=>s.index(idx).getAll(key))}
  // Resolves only after the transaction has committed, so 'saved' is honest.
  batch(ops){
    return new Promise((res,rej)=>{
      if(!ops.length)return res();
      const tx=this.db.transaction([...new Set(ops.map(o=>o.t))],'readwrite');
      for(const o of ops){const st=tx.objectStore(o.t);if(o.del)st.delete(o.id);else st.put(o.v)}
      tx.oncomplete=()=>res();
      tx.onerror=()=>rej(tx.error);
      tx.onabort=()=>rej(tx.error||new Error('Write aborted (storage may be full)'));
    });

// ---------- repository: every integrity rule lives here; every edit is one undoable changeset ----------
const nextStamp=list=>Math.max(Date.now(),...list.map(x=>x.createdAt+1));

  get canUndo(){return this.undoStack.length>0}
  get canRedo(){return this.redoStack.length>0}
  get undoLabel(){const e=this.undoStack[this.undoStack.length-1];return e?e.label:''}
  get redoLabel(){const e=this.redoStack[this.redoStack.length-1];return e?e.label:''}
  clearHistory(){this.undoStack=[];this.redoStack=[];this.lastEntry=null;this._fire()}

    this.redoStack=[];this.lastEntry=e;this._fire();return e;
  }
  async undo(){

    try{await this.s.batch(e.changes.slice().reverse().map(c=>c.before?{t:c.t,v:c.before}:{t:c.t,id:c.id,del:true}))}
    catch(err){this.undoStack.push(e);throw err}
    this.redoStack.push(e);this._fire();return e.label;
  }
  async redo(){
    const e=this.redoStack.pop();if(!e)return null;
    try{await this.s.batch(e.changes.map(c=>({t:c.t,v:c.after})))}
    catch(err){this.redoStack.push(e);throw err}
    this.undoStack.push(e);this._fire();return e.label;
  }

  async getSettings(){const v=await this.s.get('settings','app');return{...DEFAULT_SETTINGS,...(v||{})}}
  async saveSettings(v){await this.s.batch([{t:'settings',v:{...v,key:'app'}}])}

  async _rec(t,id){const r=await this.s.get(t,id);if(!r||r.deletedAt)throw new Error(t==='projects'?'Project not found.':'Bubble not found.');return r}
  getProject(id){return this._rec('projects',id)}
  getBubble(id){return this._rec('bubbles',id)}
  getBubbles(ids){return Promise.all(ids.map(id=>this.getBubble(id)))}
  async listProjects(){return(await this.s.getAll('projects')).filter(p=>!p.deletedAt).sort(byCreated)}
  async listChildren(parentId){return(await this.s.getByIndex('bubbles','parentId',parentId)).filter(b=>!b.deletedAt).sort(byCreated)}

  // ----- create / edit -----
  async createProject(input){
    const title=cleanTitle(input.title),existing=await this.listProjects(),now=nextStamp(existing);
    const pos=findFreePosition(existing.map(p=>({x:p.x,y:p.y,r:radiusFor(HOME_SIZE)})),radiusFor(HOME_SIZE));
    const projectId=newId(),rootId=newId(),colour=cleanColour(input.colour),description=cleanDesc(input.description);
    const root={id:rootId,projectId,parentId:null,title,description,colour,x:0,y:0,z:0,size:1,createdAt:now,updatedAt:now,deletedAt:null,metadata:{}};
    const project={id:projectId,title,description,colour,rootBubbleId:rootId,x:pos.x,y:pos.y,createdAt:now,updatedAt:now,deletedAt:null,metadata:{}};
    await this.commit('Create project \u201c'+title+'\u201d',[chg('bubbles',null,root),chg('projects',null,project)]);
    return project;
  }
  async updateProject(id,input){
    const title=cleanTitle(input.title),p=await this.getProject(id),root=await this.s.get('bubbles',p.rootBubbleId);
    const patch={title,description:cleanDesc(input.description),colour:cleanColour(input.colour),updatedAt:Date.now()};
    await this.commit('Edit project',[chg('projects',p,{...p,...patch}),root?chg('bubbles',root,{...root,...patch}):null]);
  }
  async createBubble(parentId,input){
    const title=cleanTitle(input.title),parent=await this.getBubble(parentId),size=cleanSize(input.size);
    const sibs=await this.listChildren(parentId);
    const pos=findFreePosition([{x:0,y:0,r:CORE_RADIUS},...sibs.map(s=>({x:s.x,y:s.y,r:radiusFor(s.size)}))],radiusFor(size));
    const now=nextStamp(sibs);
    const b={id:newId(),projectId:parent.projectId,parentId,title,description:cleanDesc(input.description),colour:cleanColour(input.colour),x:pos.x,y:pos.y,z:0,size,createdAt:now,updatedAt:now,deletedAt:null,metadata:{}};
    await this.commit('Create bubble \u201c'+title+'\u201d',[chg('bubbles',null,b)]);
    return b;
  }
  async updateBubble(id,input){
    const title=cleanTitle(input.title),b=await this.getBubble(id);
    await this.commit('Edit bubble',[chg('bubbles',b,{...b,title,description:cleanDesc(input.description),colour:cleanColour(input.colour),size:input.size==null?b.size:cleanSize(input.size),updatedAt:Date.now()})]);
  }
  async moveMany(t,moves,label){
    const ch=[];
    for(const m of moves){
      const r=await this._rec(t,m.id);
      if(r.x===m.x&&r.y===m.y&&m.meta===undefined)continue;
      ch.push(chg(t,r,{...r,x:m.x,y:m.y,metadata:m.meta!==undefined?m.meta:(r.metadata||{}),updatedAt:Date.now()}));

  moveBubble(id,x,y){return this.moveMany('bubbles',[{id,x,y}])}
  moveProject(id,x,y){return this.moveMany('projects',[{id,x,y}])}

  // ----- structure queries -----
  async descendantIds(id,includeDeleted){
    const b=await this.s.get('bubbles',id);if(!b)return[];
    const kids=new Map();
    for(const x of(await this.s.getByIndex('bubbles','projectId',b.projectId))){if((includeDeleted||!x.deletedAt)&&x.parentId){if(!kids.has(x.parentId))kids.set(x.parentId,[]);kids.get(x.parentId).push(x.id)}}
    const out=[],seen=new Set([id]);let frontier=[id];

    return out;
  }
  async countDescendants(id){return(await this.descendantIds(id)).length}
  async countProjectBubbles(pid){return Math.max(0,(await this.s.getByIndex('bubbles','projectId',pid)).filter(b=>!b.deletedAt).length-1)}
  async pathTo(id){ // bubble records from the project root down to id
    const out=[],seen=new Set();let cur=id;

    return out.reverse();
  }
  async validatePath(path){
    if(!Array.isArray(path))return false;
    if(!path.length)return true;
    if(path.some(p=>typeof p!=='string'))return false;
    const bs=await Promise.all(path.map(id=>this.s.get('bubbles',id)));
    for(let i=0;i<bs.length;i++){const b=bs[i];if(!b||b.deletedAt)return false;if(i===0?b.parentId!==null:b.parentId!==path[i-1])return false}

  }

  // ----- delete (soft) -----
  async _softDelete(label,t,ids){
    const opId=newId(),stamp=Date.now(),ch=[];
    for(const id of ids){const o=await this.s.get(t,id);if(o&&!o.deletedAt)ch.push(chg(t,o,{...o,deletedAt:stamp,deletedBy:opId}))}

  }
  async deleteBubble(id){
    const b=await this.getBubble(id);

    return this._softDelete('Delete \u201c'+b.title+'\u201d','bubbles',[id,...(await this.descendantIds(id))]);
  }
  async deleteProject(id){const p=await this.getProject(id);return this._softDelete('Delete project \u201c'+p.title+'\u201d','projects',[id])}

  // ----- duplicate -----
  async _copyConnections(map,now){
    return(await this.s.getAll('connections')).filter(c=>!c.deletedAt&&map.has(c.sourceId)&&map.has(c.targetId))
      .map(c=>chg('connections',null,{...c,id:newId(),sourceId:map.get(c.sourceId),targetId:map.get(c.targetId),createdAt:now,updatedAt:now}));
  }
  async duplicateBubble(id){
    const b=await this.getBubble(id);
    if(b.parentId===null)throw new Error('Duplicate the project instead.');
    const recs=await Promise.all([id,...(await this.descendantIds(id))].map(i=>this.s.get('bubbles',i)));
    const map=new Map(recs.map(r=>[r.id,newId()]));
    const sibs=await this.listChildren(b.parentId),now=nextStamp(sibs);
    const pos=findFreePosition([{x:0,y:0,r:CORE_RADIUS},...sibs.map(s=>({x:s.x,y:s.y,r:radiusFor(s.size)}))],radiusFor(b.size));
    const ch=recs.map(r=>chg('bubbles',null,r.id===id
      ?{...r,id:map.get(r.id),title:(r.title+' (copy)').slice(0,MAX_TITLE),x:pos.x,y:pos.y,createdAt:now,updatedAt:now,deletedAt:null,deletedBy:null,metadata:{}}
      :{...r,id:map.get(r.id),parentId:map.get(r.parentId),updatedAt:now,deletedAt:null,deletedBy:null,metadata:{...(r.metadata||{})}}));

  }
  async duplicateProject(id){
    const p=await this.getProject(id),recs=await Promise.all([p.rootBubbleId,...(await this.descendantIds(p.rootBubbleId))].map(i=>this.s.get('bubbles',i)));
    const map=new Map(recs.map(r=>[r.id,newId()])),pid=newId(),others=await this.listProjects(),now=nextStamp(others);
    const pos=findFreePosition(others.map(q=>({x:q.x,y:q.y,r:radiusFor(HOME_SIZE)})),radiusFor(HOME_SIZE));
    const title=(p.title+' (copy)').slice(0,MAX_TITLE),isRoot=r=>r.id===p.rootBubbleId;

    await this.commit('Duplicate project \u201c'+p.title+'\u201d',ch);

  }

  // ----- move to another parent (cycle-safe, may cross projects) -----
  async reparent(id,newParentId){
    const b=await this.getBubble(id);
    if(b.parentId===null)throw new Error('A project root cannot be moved. Move its contents instead.');
    const np=await this._activeBubble(newParentId);
    if(np.id===b.parentId)return null;
    const sub=await this.descendantIds(id,true); // includes contents already in the Trash, so a later restore stays consistent
    if(np.id===id||sub.includes(np.id))throw new Error('A bubble cannot be moved inside itself or its own contents.');

    const pos=findFreePosition([{x:0,y:0,r:CORE_RADIUS},...sibs.map(s=>({x:s.x,y:s.y,r:radiusFor(s.size)}))],radiusFor(b.size));

  }

  // ----- connections: separate records, so hierarchy keeps exactly one parent per bubble -----
  async _activeBubble(id){
    const b=await this.s.get('bubbles',id);
    if(!b||b.deletedAt)throw new Error('That bubble no longer exists.');
    const p=await this.s.get('projects',b.projectId);
    if(!p||p.deletedAt)throw new Error('Its project is in the Trash.');
    return b;
  }
  async createConnection(i){
    if(i.sourceId===i.targetId)throw new Error('A bubble cannot be linked to itself.');
    await this._activeBubble(i.sourceId);await this._activeBubble(i.targetId);
    const direction=i.direction==='forward'?'forward':'none',label=cleanLabel(i.label),now=Date.now();
    const dup=(await this.s.getAll('connections')).some(c=>!c.deletedAt&&c.direction===direction&&c.label.toLowerCase()===label.toLowerCase()&&
      ((c.sourceId===i.sourceId&&c.targetId===i.targetId)||(direction==='none'&&c.sourceId===i.targetId&&c.targetId===i.sourceId)));
    if(dup)throw new Error('These two bubbles are already linked that way.');
    const c={id:newId(),sourceId:i.sourceId,targetId:i.targetId,label,direction,colour:normaliseHex(i.colour)||LINK_COLOUR,createdAt:now,updatedAt:now,deletedAt:null};
    await this.commit('Connect',[chg('connections',null,c)]);return c;
  }
  async updateConnection(id,i){
    const c=await this._rec('connections',id);
    await this.commit('Edit connection',[chg('connections',c,{...c,label:cleanLabel(i.label),direction:i.direction==='forward'?'forward':'none',colour:normaliseHex(i.colour)||LINK_COLOUR,
      sourceId:i.swap?c.targetId:c.sourceId,targetId:i.swap?c.sourceId:c.targetId,updatedAt:Date.now()})]);
  }
  async deleteConnection(id){const c=await this._rec('connections',id);await this.commit('Remove connection',[chg('connections',c,{...c,deletedAt:Date.now()})])}
  // Connections hidden while an endpoint is deleted come back automatically on undo/restore.
  async connectionsForLevel(ids){
    const all=(await this.s.getAll('connections')).filter(c=>!c.deletedAt&&(ids.has(c.sourceId)||ids.has(c.targetId)));
    const ext=new Set();for(const c of all)for(const e of[c.sourceId,c.targetId])if(!ids.has(e))ext.add(e);
    const ok=new Set();for(const e of ext){try{await this._activeBubble(e);ok.add(e)}catch(_){}}
    const internal=[],extCount=new Map();
    for(const c of all){
      const sIn=ids.has(c.sourceId),tIn=ids.has(c.targetId);
      if(sIn&&tIn)internal.push(c);
      else{const inside=sIn?c.sourceId:c.targetId,out=sIn?c.targetId:c.sourceId;if(ok.has(out))extCount.set(inside,(extCount.get(inside)||0)+1)}
    }
    return{internal,extCount};
  }
  async linksOf(bubbleId){
    const info=new Map((await this.allBubblePaths()).map(x=>[x.id,x])),out=[];
    for(const c of(await this.s.getAll('connections'))){
      if(c.deletedAt||(c.sourceId!==bubbleId&&c.targetId!==bubbleId))continue;
      const otherId=c.sourceId===bubbleId?c.targetId:c.sourceId,other=info.get(otherId);
      if(other)out.push({conn:c,otherId,other,outgoing:c.sourceId===bubbleId});
    }
    return out;
  }

  // ----- layouts (positions are kept, so Freeform can always restore the hand-placed arrangement) -----
  async applyLayout(parentId,kind){
    const home=parentId===null,t=home?'projects':'bubbles';
    const kids=home?await this.listProjects():await this.listChildren(parentId);
    if(!kids.length)return 0;
    let moves;
    if(kind==='freeform'){
      moves=kids.filter(k=>k.metadata&&k.metadata.freeform).map(k=>{const m={...k.metadata};const f=m.freeform;delete m.freeform;return{id:k.id,x:f.x,y:f.y,meta:m}});
    }else{
      const pos=computeLayout(kind,kids.map(k=>({id:k.id,r:radiusFor(home?HOME_SIZE:k.size)})),!home);
      moves=kids.map(k=>{const p=pos.get(k.id),m={...(k.metadata||{})};if(!m.freeform)m.freeform={x:k.x,y:k.y};return{id:k.id,x:p.x,y:p.y,meta:m}});
    }
    if(moves.length)await this.moveMany(t,moves,'Layout: '+kind);
    return moves.length;
  }

  // ----- Trash -----
  async _trashGroups(){
    const ps=await this.s.getAll('projects'),bs=await this.s.getAll('bubbles'),groups=new Map();
    const add=(t,r)=>{if(!r.deletedAt)return;const k=r.deletedBy||('legacy-'+r.id);if(!groups.has(k))groups.set(k,{opId:k,items:[],deletedAt:r.deletedAt});groups.get(k).items.push({t,r})};
    ps.forEach(p=>add('projects',p));bs.forEach(b=>add('bubbles',b));
    const out=[...groups.values()];
    for(const g of out){
      const ids=new Set(g.items.map(i=>i.r.id));
      g.top=g.items.find(i=>i.t==='projects')||g.items.find(i=>!ids.has(i.r.parentId))||g.items[0];
      g.kind=g.top.t==='projects'?'project':'bubble';
      g.title=g.top.r.title;
      g.count=g.kind==='project'?Math.max(0,bs.filter(b=>b.projectId===g.top.r.id&&!b.deletedAt).length-1):g.items.length-1;
    }
    return out.sort((a,b)=>b.deletedAt-a.deletedAt);
  }
  listTrash(){return this._trashGroups()}
  async restoreTrash(opId){

    if(g.kind==='bubble'){
      const par=await this.s.get('bubbles',g.top.r.parentId);
      let ok=!!par&&!par.deletedAt;
      if(ok){const p=await this.s.get('projects',par.projectId);ok=!!p&&!p.deletedAt}
      if(!ok)throw new Error('What it was inside is also in the Trash (or gone). Restore that first.');

  }
  // Permanent. Clears undo history so nothing can resurrect purged records.
  async purgeTrash(opId){

    const kill=id=>{if(!gone.has(id)){gone.add(id);ops.push({t:'bubbles',id,del:true})}};
    for(const it of g.items){

      else kill(it.r.id);
    }
    for(let grew=true;grew;){grew=false;for(const b of bs)if(!gone.has(b.id)&&gone.has(b.parentId)){kill(b.id);grew=true}}
    for(const c of(await this.s.getAll('connections')))if(gone.has(c.sourceId)||gone.has(c.targetId))ops.push({t:'connections',id:c.id,del:true});
    await this.s.batch(ops);this.clearHistory();
  }

  // ----- picker data & integrity -----
  async allBubblePaths(){
    const ps=await this.s.getAll('projects'),bs=await this.s.getAll('bubbles');
    const pm=new Map(ps.filter(p=>!p.deletedAt).map(p=>[p.id,p])),bm=new Map(bs.map(b=>[b.id,b])),memo=new Map();
    const info=b=>{
      if(memo.has(b.id))return memo.get(b.id);
      memo.set(b.id,null);let r=null;
      if(!b.deletedAt&&pm.has(b.projectId)){
        if(b.parentId===null)r={titles:[b.title],depth:0};
        else{const par=bm.get(b.parentId),pi=par?info(par):null;if(pi)r={titles:[...pi.titles,b.title],depth:pi.depth+1}}
      }
      memo.set(b.id,r);return r;
    };
    const out=[];
    for(const b of bs){const i=info(b);if(i)out.push({id:b.id,title:b.title,path:i.titles.join(' \u203a '),depth:i.depth,projectId:b.projectId,parentId:b.parentId})}
    return out.sort((a,b)=>a.path.localeCompare(b.path));
  }
  async checkIntegrity(){
    const ps=await this.s.getAll('projects'),bs=await this.s.getAll('bubbles'),cs=await this.s.getAll('connections'),bad=[];
    const bm=new Map(bs.map(b=>[b.id,b])),pm=new Map(ps.map(p=>[p.id,p]));
    for(const p of ps){const r=bm.get(p.rootBubbleId);if(!r)bad.push('project '+p.id+' has no root bubble');else if(r.parentId!==null||r.projectId!==p.id)bad.push('project '+p.id+' root is inconsistent')}
    for(const b of bs){
      if(!pm.has(b.projectId))bad.push('bubble '+b.id+' belongs to a missing project');
      if(b.parentId===null){const p=pm.get(b.projectId);if(p&&p.rootBubbleId!==b.id)bad.push('bubble '+b.id+' is a stray root')}
      else{const par=bm.get(b.parentId);if(!par)bad.push('bubble '+b.id+' has a missing parent');else if(par.projectId!==b.projectId)bad.push('bubble '+b.id+' is in a different project than its parent')}
      let cur=b,steps=0;while(cur&&cur.parentId&&steps<=bs.length){cur=bm.get(cur.parentId);steps++}
      if(steps>bs.length)bad.push('bubble '+b.id+' is part of a parent cycle');
    }
    for(const c of cs){if(c.deletedAt)continue;if(!bm.has(c.sourceId)||!bm.has(c.targetId))bad.push('connection '+c.id+' has a missing end');if(c.sourceId===c.targetId)bad.push('connection '+c.id+' links a bubble to itself')}
    return bad;
  }
}

// Runs in the browser (Settings -> Run self-test, or index.html#selftest) and in Node (in-memory store only).
async function runSelfTests(){
  const results=[];
  const t=async(name,fn)=>{try{const d=await fn();results.push({name,ok:true,detail:d||''})}catch(e){results.push({name,ok:false,detail:String(e&&e.message||e)})}};

const $=s=>document.querySelector(s);
const AUTO_FLOAT_LIMIT=150;
const S={repo:null,settings:{...DEFAULT_SETTINGS},view:null,ws:null,cams:new Map(),trans:null,navToken:0,uid:0,ignorePop:false,overlay:null,toastTimer:0,statusTimer:0,memoryOnly:false};

function reduced(){
  const s=S.settings.reducedMotion;
  if(s==='on')return true;if(s==='off')return false;
  return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
const effFloat=v=>S.settings.floatingEnabled&&!reduced()&&v.items.length<=AUTO_FLOAT_LIMIT;

// ---------- data -> view ----------
async function loadView(path){
  let items,title='Home',colour=DEFAULT_COLOUR,crumbs=[],coreId=null,coreProject=null;
  if(!path.length){
    items=(await S.repo.listProjects()).map(p=>({id:p.id,openId:p.rootBubbleId,title:p.title,description:p.description,colour:p.colour,x:p.x,y:p.y,size:HOME_SIZE}));
  }else{
    const bs=await S.repo.getBubbles(path),tip=bs[bs.length-1];
    title=tip.title;colour=tip.colour;crumbs=bs.map(b=>b.title);coreId=tip.id;coreProject=tip.parentId===null?tip.projectId:null;
    items=(await S.repo.listChildren(tip.id)).map(b=>({id:b.id,openId:b.id,title:b.title,description:b.description,colour:b.colour,x:b.x,y:b.y,size:b.size}));
  }
  const ids=new Set(items.map(i=>i.openId));if(coreId)ids.add(coreId);
  const{internal,extCount}=await S.repo.connectionsForLevel(ids);
  const idOf=new Map(items.map(i=>[i.openId,i.id]));if(coreId)idOf.set(coreId,'__core');
  items.forEach(i=>{i.ext=extCount.get(i.openId)||0});
  const conns=internal.map(c=>({id:c.id,a:idOf.get(c.sourceId),b:idOf.get(c.targetId),label:c.label,direction:c.direction,colour:c.colour}));
  return{uid:++S.uid,path,title,colour,crumbs,items,conns,coreId,coreProject};
}
async function reloadView(){
  const cur=S.view;if(!cur)return;
  let f;try{f=await loadView(cur.path)}catch(e){console.error(e);return}
  if(S.view!==cur)return;
  S.view=f;S.ws.setItems(f.items);S.ws.setConnections(f.conns);S.ws.setCore(f.title,f.colour);S.ws.setFloating(effFloat(f));renderChrome();
}
// Runs a storage write and reports honestly: 'Saved' only after the transaction committed.
async function run(fn,quiet){
  window.clearTimeout(S.statusTimer);setStatus('Saving\u2026');
  try{
    const value=await fn();
    setStatus(S.memoryOnly?'Not stored (temporary mode)':'Saved \u2713');
    S.statusTimer=window.setTimeout(()=>setStatus(''),2500);
    return{ok:true,value};
  }catch(error){
    console.error(error);setStatus('Save failed',true);
    if(!quiet)toast('Could not save: '+(error&&error.message||'unknown error'));
    try{await reloadView()}catch(_){}
    return{ok:false,error};
  }
}
function setStatus(t,err){const s=$('#status');s.textContent=t;s.className=err?'error':''}
function toast(text,actionLabel,onAction,ms){
  const box=$('#toast');window.clearTimeout(S.toastTimer);box.textContent='';
  const t=h('div',{class:'toast'},h('span',{},text));
  if(actionLabel)t.append(h('button',{type:'button',onclick:()=>{box.textContent='';window.clearTimeout(S.toastTimer);onAction&&onAction()}},actionLabel));
  box.append(t);S.toastTimer=window.setTimeout(()=>{box.textContent=''},ms||(actionLabel?9000:4500));
}
// Offers Undo for the change that was just made, but only while it is still the latest change.
function toastUndo(text){
  const entry=S.repo.lastEntry;
  toast(text,'Undo',async()=>{
    if(S.repo.undoStack[S.repo.undoStack.length-1]!==entry){toast('Other changes were made since. Use the Trash or the Undo button.');return}
    await doUndo();
  },10000);
}

  const cur=S.view;let p=cur.path;
  while(p.length&&!(await S.repo.validatePath(p)))p=p.slice(0,-1);
  if(p.length!==cur.path.length){history.replaceState({bm:1,path:p},'');await navigate(p,false)}
  else await reloadView();
}
async function doUndo(){

  const r=await run(()=>S.repo.undo());if(!r.ok)return;
  await afterHistory();toast('Undid: '+r.value);
}
async function doRedo(){
  if(!S.repo.canRedo){toast('Nothing to redo');return}
  const r=await run(()=>S.repo.redo());if(!r.ok)return;
  await afterHistory();toast('Redid: '+r.value);
}
function updateHistoryButtons(){

// ---------- navigation ----------
function stageSize(){const r=$('#stage').getBoundingClientRect();return{W:r.width||innerWidth,H:r.height||innerHeight}}
function computeOrigin(kind,cur,next){
  const{W,H}=stageSize(),fb={x:W/2,y:H/2,r:60,colour:DEFAULT_COLOUR,W,H};
  let item,cam;
  if(kind==='enter'){item=cur.items.find(i=>i.openId===next.path[next.path.length-1]);cam=S.ws?S.ws.cam:DEFAULT_CAMERA}
  else if(kind==='back'){item=next.items.find(i=>i.openId===cur.path[cur.path.length-1]);cam=S.cams.get(camKey(next.path))||DEFAULT_CAMERA}
  if(!item)return fb;
  return{x:W/2+cam.x+item.x*cam.k,y:H/2+cam.y+item.y*cam.k,r:Math.max(20,radiusFor(item.size)*cam.k),colour:item.colour,W,H};
}
async function navigate(newPath,push){
  const cur=S.view;if(!cur||samePath(cur.path,newPath))return;
  const token=++S.navToken;let next;
  try{next=await loadView(newPath)}catch(e){console.error(e);toast('That bubble could not be opened.');return}
  if(token!==S.navToken)return;
  finishTransition();
  if(push)history.pushState({bm:1,path:newPath},'');
  const kind=newPath.length>cur.path.length&&isPrefix(cur.path,newPath)?'enter':newPath.length<cur.path.length&&isPrefix(newPath,cur.path)?'back':'swap';
  const origin=computeOrigin(kind,cur,next),oldWs=S.ws;
  oldWs.freeze();S.cams.set(camKey(cur.path),{...oldWs.cam});
  S.view=next;S.ws=mountWorkspace(next);
  renderChrome();setStatus('');
  runTransition(kind,origin,oldWs,S.ws);
}
function mountWorkspace(v){
  const key=camKey(v.path);
  const ws=new Workspace({
    items:v.items,conns:v.conns,showCore:v.path.length>0,coreTitle:v.title,coreColour:v.colour,
    camera:S.cams.get(key)||DEFAULT_CAMERA,floating:effFloat(v),getSnap:()=>S.settings.gridSnap?GRID:0,
    onOpen:openItem,onMenu:openItemMenu,onMove:onMoveItem,onCore:openCoreMenu,
    onCamera:c=>{S.cams.set(key,c);updateRecenter()}
  });
  $('#stage').insertBefore(ws.root,$('#ripple'));
  return ws;
}
function runTransition(kind,o,oldWs,newWs){
  const leaveEl=oldWs.root,enterEl=newWs.root,rip=$('#ripple');
  S.trans={oldWs,newWs,anims:[],timer:0};
  if(typeof enterEl.animate!=='function'){finishTransition();return}
  const opt=(d,delay,ease)=>({duration:d,delay:delay||0,easing:ease||'cubic-bezier(.5,0,.2,1)',fill:'both'});
  const A=S.trans.anims;
  if(reduced()||kind==='swap'){
    A.push(leaveEl.animate([{opacity:1},{opacity:0}],opt(130)),enterEl.animate([{opacity:0},{opacity:1}],opt(170)));
  }else if(kind==='enter'){
    leaveEl.style.transformOrigin=o.x+'px '+o.y+'px';enterEl.style.transformOrigin='50% 50%';
    A.push(leaveEl.animate([{transform:'scale(1)',opacity:1},{transform:'scale(3.4)',opacity:0}],opt(720,0,'cubic-bezier(.55,0,.35,1)')));
    A.push(enterEl.animate([{transform:'scale(.55)',opacity:0},{transform:'scale(1)',opacity:1}],opt(620,200,'cubic-bezier(.2,.7,.2,1)')));
    const far=Math.hypot(Math.max(o.x,o.W-o.x),Math.max(o.y,o.H-o.y));
    rip.style.cssText='display:block;left:'+(o.x-o.r)+'px;top:'+(o.y-o.r)+'px;width:'+(o.r*2)+'px;height:'+(o.r*2)+'px;--c:'+o.colour;
    A.push(rip.animate([{transform:'scale(1)',opacity:.75},{transform:'scale('+(far/o.r*1.15)+')',opacity:0}],opt(760,0,'cubic-bezier(.4,0,.2,1)')));
  }else{
    leaveEl.style.transformOrigin='50% 50%';enterEl.style.transformOrigin=o.x+'px '+o.y+'px';
    A.push(leaveEl.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.45)',opacity:0}],opt(560,0,'cubic-bezier(.5,0,.8,.4)')));
    A.push(enterEl.animate([{transform:'scale(2.6)',opacity:0},{transform:'scale(1)',opacity:1}],opt(620,60,'cubic-bezier(.2,.7,.2,1)')));
  }
  const t=S.trans;
  Promise.all(A.map(a=>a.finished)).then(()=>{if(S.trans===t)finishTransition()},()=>{});
  t.timer=window.setTimeout(()=>{if(S.trans===t)finishTransition()},1400);
}
function finishTransition(){
  const t=S.trans;if(!t)return;S.trans=null;window.clearTimeout(t.timer);
  for(const a of t.anims){try{a.cancel()}catch(_){}}
  t.oldWs.destroy();t.newWs.root.style.transformOrigin='';$('#ripple').style.display='none';
}
function openItem(id){
  const cur=S.view;if(!cur||S.overlay)return;
  const it=cur.items.find(i=>i.id===id);if(!it)return;
  navigate([...cur.path,it.openId],true);
}
// Cross-level / cross-project navigation (used by links): walks the real parent chain to the target.
async function goToBubble(bubbleId){
  try{const path=(await S.repo.pathTo(bubbleId)).map(b=>b.id);navigate(path,true)}
  catch(e){toast('Could not open that bubble: '+e.message)}
}
function jumpTo(depth){
  const cur=S.view;if(!cur||depth>=cur.path.length||depth<0)return;
  const target=cur.path.slice(0,depth);
  history.go(-(cur.path.length-depth));
  window.setTimeout(()=>{if(S.view===cur){history.replaceState({bm:1,path:target},'');navigate(target,false)}},450);
}
const goBack=()=>{if(S.view&&S.view.path.length)jumpTo(S.view.path.length-1)};
async function onPopState(e){
  if(S.ignorePop){S.ignorePop=false;return}
  if(S.overlay){closeOverlay();S.ignorePop=true;history.go(1);return}
  const st=e.state;
  if(st&&st.sentinel){history.back();return}
  let path=st&&Array.isArray(st.path)?st.path:[];
  if(!(await S.repo.validatePath(path))){path=[];history.replaceState({bm:1,path:[]},'')}
  navigate(path,false);
}
async function onMoveItem(id,x,y){
  const v=S.view,home=v.path.length===0,it=v.items.find(i=>i.id===id);
  if(it){it.x=x;it.y=y}
  await run(()=>home?S.repo.moveProject(id,x,y):S.repo.moveBubble(id,x,y));
  S.ws.updateConns();
}

// <DIALOGS>
function openOverlay(title,variant,dismiss,build){
  closeOverlay();
  const prev=document.activeElement;
  const bd=h('div',{class:'backdrop '+(variant==='sheet'?'sheet':'')});
  const box=h('div',{class:'dialog',role:'dialog','aria-modal':'true','aria-label':title,tabindex:'-1'},h('h2',{},title));
  bd.append(box);$('#overlay').append(bd);
  const focusables=()=>[...box.querySelectorAll('button,input,textarea,[tabindex]:not([tabindex="-1"])')].filter(e=>!e.disabled);
  const onKey=e=>{
    if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeOverlay();return}
    if(e.key!=='Tab')return;
    const f=focusables();if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  };
  document.addEventListener('keydown',onKey,true);
  if(dismiss)bd.addEventListener('pointerdown',e=>{if(e.target===bd)closeOverlay()});
  S.overlay={bd,onKey,prev};
  build(box,closeOverlay);
  (box.querySelector('[data-autofocus]')||focusables()[0]||box).focus();
}
function closeOverlay(){
  const o=S.overlay;if(!o)return;S.overlay=null;
  document.removeEventListener('keydown',o.onKey,true);o.bd.remove();
  if(S.ws)S.ws.pin(null);
  try{o.prev&&o.prev.focus&&o.prev.focus()}catch(_){}
}
const seg=(opts,get,set)=>{ // segmented buttons
  const wrap=h('div',{class:'seg'});
  const paint=()=>wrap.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(get()))));
  opts.forEach(([v,l])=>wrap.append(h('button',{type:'button',class:'btn','data-v':v,onclick:()=>{set(v);paint()}},l)));
  paint();return wrap;
};
function swatches(get,set,extra){
  const sw=h('div',{class:'swatches'}),custom=h('input',{type:'color',class:'swatch custom','aria-label':'Custom colour',value:get()});
  const paint=()=>{sw.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c===get())));custom.value=get()};
  [...PALETTE,...(extra||[])].forEach(c=>sw.append(h('button',{type:'button',class:'swatch','data-c':c,'aria-label':'Colour '+c,style:'background:'+c,onclick:()=>{set(c);paint()}})));
  custom.addEventListener('input',()=>{set(normaliseHex(custom.value)||get());paint()});
  sw.append(custom);paint();return sw;
}
function formShell(box,o,fields){
  const err=h('p',{class:'err',role:'alert'}),submit=h('button',{type:'submit',class:'btn primary'},o.submitLabel);
  let busy=false;
  const form=h('form',{novalidate:'',onsubmit:async e=>{
    e.preventDefault();if(busy||submit.disabled)return;busy=true;submit.disabled=true;err.textContent='';
    try{await o.onSubmit();o.close()}catch(ex){err.textContent=ex&&ex.message||'Something went wrong.';busy=false;submit.disabled=false;if(o.sync)o.sync()}
  }},...fields,err,h('div',{class:'actions'},h('button',{type:'button',class:'btn',onclick:o.close},'Cancel'),submit));
  box.append(form);return submit;
}
const nearestSize=s=>String(SIZES.reduce((a,b)=>Math.abs(b[1]-(s||1))<Math.abs(a[1]-(s||1))?b:a)[1]);

function itemForm(box,o){

  openOverlay(ent.isProject?'Delete project?':'Delete bubble?','modal',false,(box,close)=>{
    box.append(
      h('p',{},'\u201c'+ent.title+'\u201d '+(n?'contains '+n+' bubble'+(n===1?'':'s')+' that will go with it.':'has nothing inside it.')),
      h('p',{class:'note'},'It moves to the Trash (menu \u2192 Trash), where you can restore it later. Links to it are hidden meanwhile and come back if you restore it.'),
      h('div',{class:'actions'},h('button',{type:'button',class:'btn',onclick:close,'data-autofocus':''},'Cancel'),
        h('button',{type:'button',class:'btn danger',onclick:async()=>{
          close();
          const r=await run(()=>ent.isProject?S.repo.deleteProject(ent.projectId):S.repo.deleteBubble(ent.bubbleId));
          if(!r.ok)return;
          await afterHistory();toastUndo('Deleted \u201c'+ent.title+'\u201d');
        }},'Delete')));
  });
}

// ---------- arrange, trash, menu, settings ----------
async function applyLayoutKind(k){
  const parent=S.view.path.length?S.view.coreId:null;
  const r=await run(()=>S.repo.applyLayout(parent,k));if(!r.ok)return;
  await reloadView();
  if(r.value){toastUndo(k==='freeform'?'Restored your hand-placed positions':'Arranged: '+k)}
  else toast(k==='freeform'?'Nothing to restore \u2014 positions are already hand-placed.':'Nothing to arrange here yet.');
  if(S.settings.defaultLayout!==k)changeSettings({defaultLayout:k});
}
function openLayout(){
  openOverlay('Arrange bubbles','sheet',true,(box,close)=>{
    const kinds=[['freeform','Freeform \u2014 restore my hand-placed positions'],['radial','Radial \u2014 rings around the centre'],['tree','Tree \u2014 rows beneath the centre'],['grid','Grid \u2014 even squares']];
    const snap=h('input',{type:'checkbox',role:'switch','aria-label':'Snap to grid while dragging'});snap.checked=S.settings.gridSnap;
    snap.addEventListener('change',()=>changeSettings({gridSnap:snap.checked}));
    box.append(
      h('div',{class:'menu'},...kinds.map(([k,l])=>h('button',{type:'button',class:'btn',onclick:()=>{close();applyLayoutKind(k)}},(S.settings.defaultLayout===k?'\u2713 ':'')+l))),
      h('p',{class:'note'},'Arranging never loses anything: Freeform brings your own positions back, and Undo reverses any arrangement.'),
      h('label',{class:'row'},h('span',{},'Snap to grid while dragging'),snap),
      h('div',{class:'actions'},h('button',{type:'button',class:'btn primary',onclick:close},'Done')));
  });
}
async function openTrash(){
  let groups;try{groups=await S.repo.listTrash()}catch(e){toast('Could not read the Trash: '+e.message);return}
  openOverlay('Trash','modal',true,(box,close)=>{
    box.classList.add('wide');
    box.append(h('p',{class:'note'},'Deleted items stay here until you delete them forever. Restoring puts them back where they were.'));
    const list=h('div',{class:'list'});
    if(!groups.length)list.append(h('p',{class:'note'},'The Trash is empty.'));
    for(const g of groups){
      let armed=false,timer=0;
      const purge=h('button',{type:'button',class:'btn',onclick:async()=>{
        if(!armed){armed=true;purge.textContent='Sure?';purge.classList.add('danger');timer=window.setTimeout(()=>{armed=false;purge.textContent='Delete forever';purge.classList.remove('danger')},4000);return}
        window.clearTimeout(timer);close();
        const r=await run(()=>S.repo.purgeTrash(g.opId));if(r.ok){await reloadView();toast('Deleted forever. Undo history was cleared.')}
      }},'Delete forever');
      list.append(h('div',{class:'rowline'},
        h('div',{class:'t'},(g.kind==='project'?'Project: ':'')+g.title,h('small',{},(g.count?g.count+' item'+(g.count===1?'':'s')+' inside \u00b7 ':'')+new Date(g.deletedAt).toLocaleString())),
        h('button',{type:'button',class:'btn primary',onclick:async()=>{const r=await run(()=>S.repo.restoreTrash(g.opId));if(r.ok){close();await afterHistory();toastUndo('Restored \u201c'+g.title+'\u201d')}}},'Restore'),purge));
    }
    box.append(list,h('div',{class:'actions'},h('button',{type:'button',class:'btn',onclick:close},'Close')));
  });
}
function openMenu(){
  openOverlay('Menu','sheet',true,(box,close)=>{
    const btn=(label,fn,dis)=>h('button',{type:'button',class:'btn',disabled:dis,onclick:()=>{close();fn()}},label);
    box.append(h('div',{class:'menu'},
      btn('Undo'+(S.repo.canUndo?': '+S.repo.undoLabel:''),doUndo,!S.repo.canUndo),
      btn('Redo'+(S.repo.canRedo?': '+S.repo.redoLabel:''),doRedo,!S.repo.canRedo),
      btn('Arrange bubbles\u2026',openLayout),btn('Trash\u2026',openTrash),btn('Settings\u2026',openSettings),
      h('button',{type:'button',class:'btn',onclick:close},'Close')));
  });
}
function applyTheme(){
  const mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)');
  let t=S.settings.theme;if(t==='system')t=mq&&mq.matches?'light':'dark';
  document.documentElement.dataset.theme=t;
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#f1f4ff':'#0a0e1a');
}
function applySettings(){
  applyTheme();document.documentElement.dataset.motion=reduced()?'reduced':'full';
  if(S.view){S.ws.setFloating(effFloat(S.view));renderChrome()}
}
async function changeSettings(patch){S.settings={...S.settings,...patch};applySettings();await run(()=>S.repo.saveSettings(S.settings))}
function openSettings(){
  openOverlay('Settings','sheet',true,(box,close)=>{
    const group=(label,opts,key,hint)=>h('fieldset',{class:'field'},h('legend',{},label),seg(opts,()=>S.settings[key],v=>changeSettings({[key]:v})),hint?h('p',{class:'note'},hint):null);
    const sw=(label,key)=>{const i=h('input',{type:'checkbox',role:'switch','aria-label':label});i.checked=S.settings[key];i.addEventListener('change',()=>changeSettings({[key]:i.checked}));return h('label',{class:'row'},h('span',{},label),i)};
    box.append(
      group('Theme',[['dark','Dark'],['light','Light'],['system','System']],'theme'),
      group('Reduced motion',[['system','Follow device'],['on','Always'],['off','Never']],'reducedMotion','Reduced motion stops floating and replaces the travel animation with a quick fade.'),
      sw('Floating bubbles','floatingEnabled'),sw('Snap to grid while dragging','gridSnap'),
      h('p',{class:'note'},'Your ideas are stored only in this browser on this device. Clearing browser data or a storage clean-up can erase them. Backup export is planned for Stage 4 and is not available yet.'),
      h('div',{class:'actions'},h('button',{type:'button',class:'btn',onclick:()=>{close();showSelfTests()}},'Run self-test'),h('button',{type:'button',class:'btn primary',onclick:close},'Done')));
  });
}
async function showSelfTests(){
  const box=h('div',{id:'selftest'},h('h2',{},'Bubble Mind self-test'),h('p',{},'Running\u2026'));
  document.body.append(box);
  const res=await runSelfTests(),failed=res.filter(r=>!r.ok).length;
  box.textContent='';
  box.append(h('h2',{},'Bubble Mind self-test'),h('p',{class:failed?'fail':'pass'},res.length+' checks, '+failed+' failed'),
    ...res.map(r=>h('div',{class:r.ok?'pass':'fail'},(r.ok?'PASS ':'FAIL ')+r.name+(r.detail?' \u2014 '+r.detail:''))),
    h('p',{},h('button',{type:'button',class:'btn primary',onclick:()=>{box.remove();if(location.hash==='#selftest')history.replaceState(history.state,'',location.pathname+location.search)}},'Close')));
}
function showBanner(text){const b=$('#banner');b.textContent=text;b.hidden=false}
// </DIALOGS>

// <INIT>
async function init(){
  try{
    try{S.repo=new Repo(await IdbStore.open('bubble-mind'))}
    catch(e){
      console.error(e);S.memoryOnly=true;S.repo=new Repo(new MemoryStore());
      showBanner('Browser storage is unavailable here, so nothing you create will be kept after closing. Try a normal (non-private) browser window.');
    }
    S.repo.onHistory(updateHistoryButtons);
    try{S.settings=await S.repo.getSettings()}catch(e){console.error(e)}
    applyTheme();document.documentElement.dataset.motion=reduced()?'reduced':'full';
    try{const bad=await S.repo.checkIntegrity();if(bad.length)console.warn('Bubble Mind integrity warnings:',bad)}catch(e){console.error(e)}
    let path=[];const st=history.state;
    if(st&&st.bm&&Array.isArray(st.path)){if(await S.repo.validatePath(st.path))path=st.path;else history.replaceState({bm:1,path:[]},'')}
    else if(st&&st.bm&&st.sentinel){history.pushState({bm:1,path:[]},'')}
    else{history.replaceState({bm:1,sentinel:true},'');history.pushState({bm:1,path:[]},'')}
    S.view=await loadView(path);S.ws=mountWorkspace(S.view);renderChrome();

    window.addEventListener('popstate',onPopState);
    $('#begin').addEventListener('click',()=>{
      const b=$('#begin');b.classList.remove('tap');void b.offsetWidth;b.classList.add('tap');
      window.setTimeout(()=>{if(!S.overlay)openCreate()},200);
    });
    $('#fab').addEventListener('click',()=>{if(!S.overlay)openCreate()});
    $('#backBtn').addEventListener('click',goBack);
    $('#floatBtn').addEventListener('click',()=>changeSettings({floatingEnabled:!S.settings.floatingEnabled}));
    $('#menuBtn').addEventListener('click',()=>{if(!S.overlay)openMenu()});
    $('#undoBtn').addEventListener('click',()=>{if(!S.overlay)doUndo()});
    $('#redoBtn').addEventListener('click',()=>{if(!S.overlay)doRedo()});
    $('#recenter').addEventListener('click',()=>S.ws.resetView());
    document.addEventListener('keydown',e=>{
      const t=e.target,typing=t&&(/^(INPUT|TEXTAREA)$/.test(t.tagName)||t.isContentEditable);
      if((e.ctrlKey||e.metaKey)&&!typing&&!S.overlay){
        const k=e.key.toLowerCase();
        if(k==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return}
        if(k==='y'){e.preventDefault();doRedo();return}
      }
      if(e.key==='Escape'&&!S.overlay&&!e.defaultPrevented&&!typing)goBack();
    });
    if(window.matchMedia){for(const q of['(prefers-color-scheme: light)','(prefers-reduced-motion: reduce)']){const mq=window.matchMedia(q);if(mq.addEventListener)mq.addEventListener('change',applySettings)}}
    // Every write is committed to IndexedDB before the UI says 'Saved', so there is nothing to flush on close.
    window.__bm={S};
    if(location.hash==='#selftest')showSelfTests();
  }catch(err){
    console.error(err);
    showBanner('Bubble Mind could not start: '+(err&&err.message||err)+'. Your stored data has not been touched.');
  }
}
if(typeof document!=='undefined'&&document.getElementById('app'))init();
// </INIT>
</script>
