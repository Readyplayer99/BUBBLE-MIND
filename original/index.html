<!doctype html>
<html lang='en' data-theme='dark'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content'>
<meta name='theme-color' content='#0a0e1a'>
<meta name='description' content='Bubble Mind - explore your ideas as floating bubbles.'>
<title>Bubble Mind</title>
<style>
:root{--bg:#0a0e1a;--bg2:#17204a;--fg:#eef2ff;--muted:#a3aed0;--panel:#151d3a;--line:rgba(255,255,255,.14);--accent:#7aa2ff}
[data-theme=light]{--bg:#f1f4ff;--bg2:#dfe6ff;--fg:#10162b;--muted:#4a5476;--panel:#ffffff;--line:rgba(0,0,0,.16);--accent:#3b5bdb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0}
#main{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 45%,var(--bg2) 0,var(--bg) 72%)}
.top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;z-index:5}
#crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow:hidden;white-space:nowrap}
.crumb{background:none;border:0;padding:10px 6px;min-height:44px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;color:var(--muted);border-radius:10px;display:inline-block;line-height:24px}
.crumb.current{color:var(--fg);font-weight:600;cursor:default}
.sep{color:var(--muted);opacity:.6}
.icon,.pill{min-width:44px;min-height:44px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 80%,transparent);border-radius:22px;padding:0 14px}
.icon{padding:0;font-size:20px}
.pill[aria-pressed=false]{opacity:.7}
.pill.small{min-height:40px;font-size:14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,.bubble:focus-visible .bubble__inner,.core:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none}
.layer{position:absolute;inset:0;touch-action:none;will-change:transform,opacity}
.layer.frozen{pointer-events:none}
.world{position:absolute;left:50%;top:50%;width:0;height:0;will-change:transform}
.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.bubble{position:absolute;left:0;top:0;border-radius:50%;cursor:pointer;touch-action:none;will-change:transform}
.bubble__inner{position:relative;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;padding:12%;text-align:center;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--c) 88%,#fff) 0,var(--c) 55%,color-mix(in srgb,var(--c) 78%,#000) 100%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 -10px 20px rgba(0,0,0,.18),inset 0 8px 16px rgba(255,255,255,.3),0 8px 26px color-mix(in srgb,var(--c) 38%,transparent);transition:transform .16s ease,box-shadow .16s ease}
.bubble.pop .bubble__inner{animation:pop .5s cubic-bezier(.2,1.25,.4,1) backwards;animation-delay:var(--d,0ms)}
.bubble__inner::after{content:'';position:absolute;left:20%;top:12%;width:34%;height:20%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,0));transform:rotate(-28deg);pointer-events:none}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.bubble.is-pressed .bubble__inner{transform:scale(.93)}
.bubble.is-dragging .bubble__inner{transform:scale(1.07);box-shadow:inset 0 -10px 20px rgba(0,0,0,.18),inset 0 8px 16px rgba(255,255,255,.3),0 18px 40px rgba(0,0,0,.4)}
.bubble__label,.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;line-height:1.15;pointer-events:none}
.bubble__label{font-size:var(--fs,16px);font-weight:650}
.bubble[data-tone=light] .bubble__label{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.bubble[data-tone=dark] .bubble__label{color:#0b1020}
.core{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;padding:16px;text-align:center;cursor:pointer;border:2px dashed color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--fg);font-size:14px;font-weight:600}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;pointer-events:none;z-index:2}
#begin{pointer-events:auto;width:min(210px,56vw);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.4);padding:20px;font-size:22px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.55),transparent 34%),radial-gradient(circle at 50% 55%,#6f8dff,#4a3fd0 75%,#2a2a85);box-shadow:inset 0 -14px 28px rgba(0,0,0,.25),0 0 60px 8px rgba(122,162,255,.35);animation:bob 7s ease-in-out infinite,glow 4.5s ease-in-out infinite}
[data-float=off] #begin{animation:glow 4.5s ease-in-out infinite}
#begin.tap{animation:tap .32s ease-out}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes glow{50%{box-shadow:inset 0 -14px 28px rgba(0,0,0,.25),0 0 84px 16px rgba(122,162,255,.5)}}
@keyframes tap{40%{transform:scale(.9)}100%{transform:scale(1.05)}}
.tagline{margin:0;color:var(--muted);font-size:17px;font-style:italic;text-align:center;padding:0 24px}
#ripple{position:absolute;display:none;border-radius:50%;pointer-events:none;z-index:3;background:radial-gradient(circle,transparent 55%,color-mix(in srgb,var(--c) 60%,transparent) 100%)}
#hint{position:absolute;left:50%;top:calc(50% + 100px);transform:translateX(-50%);margin:0;width:min(320px,80vw);text-align:center;color:var(--muted);pointer-events:none}
#status{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:13px;color:var(--muted);pointer-events:none;z-index:4}
#status.error{color:#ff8a8a;font-weight:600}
#recenter{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:4}
.fab{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,255,255,.4);font-size:34px;line-height:1;color:#fff;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.5),transparent 40%),linear-gradient(135deg,#6f8dff,#5a43d6);box-shadow:0 8px 24px rgba(60,70,200,.5);z-index:6}
.fab:active{transform:scale(.94)}
#overlay .backdrop{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,7,18,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .18s ease-out}
#overlay .backdrop.sheet{align-items:flex-end;padding:0}
.dialog{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:rise .22s ease-out}
.sheet .dialog{border-bottom-left-radius:0;border-bottom-right-radius:0;width:min(520px,100%);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.dialog h2{margin:0 0 12px;font-size:20px;overflow-wrap:anywhere}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.field{display:block;margin:0 0 14px;border:0;padding:0;min-width:0}
.field>span,.field legend{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;padding:0}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:color-mix(in srgb,var(--fg) 8%,transparent);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
textarea{resize:vertical}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:40px;height:40px;border-radius:50%;border:2px solid transparent;padding:0}
.swatch[aria-pressed=true]{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--panel)}
input.swatch.custom{background:none;border:2px solid var(--line);padding:2px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.btn{min-height:46px;padding:0 20px;border-radius:23px;border:1px solid var(--line);background:transparent}
.btn.primary{background:linear-gradient(135deg,#6f8dff,#5a43d6);border-color:transparent;color:#fff;font-weight:600}
.btn.danger{background:#c43b3b;border-color:transparent;color:#fff;font-weight:600}
.btn:disabled{opacity:.5}
.err{color:#ff8a8a;min-height:1.2em;margin:0 0 6px;font-size:14px}
.menu{display:flex;flex-direction:column;gap:6px}
.menu .btn{text-align:left;border-radius:14px;width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{padding:0 14px;min-height:44px}
.seg .btn[aria-pressed=true]{background:var(--accent);color:#fff;border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.row input{width:26px;height:26px}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;max-width:min(92vw,460px)}
.toast{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);padding:10px 12px 10px 16px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:rise .2s ease-out}
.toast button{min-height:40px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:var(--accent);font-weight:700}
#banner{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 58px);z-index:40;background:#b3261e;color:#fff;padding:8px 12px;border-radius:12px;font-size:14px;text-align:center}
#selftest{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--fg);overflow:auto;padding:16px;font:14px/1.5 ui-monospace,Consolas,monospace;-webkit-user-select:text;user-select:text}
#selftest .pass{color:#5fd6a4}#selftest .fail{color:#ff8a8a;font-weight:700}
[data-motion=reduced] *,[data-motion=reduced] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
</style>
</head>
<body>
<div id='app'>
 <div id='main'>
  <header class='top'>
   <button id='backBtn' class='icon' aria-label='Back one level' hidden>&#8592;</button>
   <nav id='crumbs' aria-label='Breadcrumb'></nav>
   <button id='floatBtn' class='pill' type='button' aria-pressed='true'>Float: on</button>
   <button id='settingsBtn' class='icon' type='button' aria-label='Settings'>&#9881;</button>
  </header>
  <div id='stage'>
   <div id='ripple'></div>
   <div id='empty' hidden>
    <button id='begin' type='button'>Begin an Idea</button>
    <p class='tagline'>Every universe begins with a thought.</p>
   </div>
   <p id='hint' hidden>Nothing inside yet. Tap + to add the first idea.</p>
   <div id='status' role='status' aria-live='polite'></div>
   <button id='recenter' class='pill small' type='button' hidden>Recenter</button>
  </div>
  <button id='fab' class='fab' type='button' aria-label='New project'>+</button>
 </div>
 <div id='overlay'></div>
 <div id='toast' role='status' aria-live='polite'></div>
 <div id='banner' role='alert' hidden></div>
</div>
<script>
'use strict';
// <CORE>
const PALETTE=['#7aa2ff','#b58cff','#ff7eb6','#ff9f6b','#ffd166','#5fd6a4','#4fd1e8','#e86a6a'];
const DEFAULT_COLOUR=PALETTE[0];
const MAX_TITLE=200, BASE_RADIUS=46, HOME_SIZE=1.3, CORE_RADIUS=60;
const DEFAULT_SETTINGS={key:'app',theme:'dark',floatingEnabled:true,reducedMotion:'system'};

function newId(){
  const c=globalThis.crypto;
  if(c&&typeof c.randomUUID==='function')return c.randomUUID();
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function normaliseHex(input){
  const m=/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(input||'').trim());
  if(!m)return null;
  let x=m[1].toLowerCase();
  if(x.length===3)x=x.split('').map(c=>c+c).join('');
  return '#'+x;
}
function channel(v){const s=v/255;return s<=0.03928?s/12.92:Math.pow((s+0.055)/1.055,2.4)}
function luminance(hex){
  const h=normaliseHex(hex)||DEFAULT_COLOUR;
  return 0.2126*channel(parseInt(h.slice(1,3),16))+0.7152*channel(parseInt(h.slice(3,5),16))+0.0722*channel(parseInt(h.slice(5,7),16));
}
function contrastWith(hex){const L=luminance(hex);return{white:1.05/(L+0.05),black:(L+0.05)/0.05}}
function readableTone(hex){const c=contrastWith(hex);return c.white>=c.black?'light':'dark'}
const radiusFor=size=>BASE_RADIUS*Math.min(2.2,Math.max(0.6,size||1));

// Deterministic outward spiral: first point that does not overlap any existing circle.
function findFreePosition(existing,r,gap=28){
  const golden=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<20000;i++){
    const d=70*Math.sqrt(i);
    const x=Math.round(d*Math.cos(i*golden)), y=Math.round(d*Math.sin(i*golden));
    let free=true;
    for(const c of existing){if(Math.hypot(c.x-x,c.y-y)<c.r+r+gap){free=false;break}}
    if(free)return{x,y};
  }
  return{x:existing.length*200,y:0};
}

function cleanTitle(t){const v=String(t==null?'':t).trim().slice(0,MAX_TITLE);if(!v)throw new Error('A title is required.');return v}
const cleanColour=c=>normaliseHex(c)||DEFAULT_COLOUR;
const cleanDesc=d=>String(d==null?'':d).trim().slice(0,5000);
const byCreated=(a,b)=>a.createdAt-b.createdAt||(a.id<b.id?-1:1);

// ---------- storage back-ends (same tiny interface) ----------
class MemoryStore{
  constructor(){this.t={projects:new Map(),bubbles:new Map(),settings:new Map()}}
  async get(t,id){const v=this.t[t].get(id);return v?structuredClone(v):undefined}
  async getAll(t){return[...this.t[t].values()].map(v=>structuredClone(v))}
  async getByIndex(t,idx,key){return(await this.getAll(t)).filter(v=>v[idx]===key)}
  async batch(ops){
    for(const o of ops)if(!this.t[o.t])throw new Error('Unknown table '+o.t);
    for(const o of ops)this.t[o.t].set(o.t==='settings'?o.v.key:o.v.id,structuredClone(o.v));
  }
  close(){}
}

class IdbStore{
  constructor(db){this.db=db}
  static open(name){
    return new Promise((res,rej)=>{
      if(typeof indexedDB==='undefined')return rej(new Error('IndexedDB is unavailable'));
      let r;
      try{r=indexedDB.open(name,1)}catch(e){return rej(e)}
      r.onupgradeneeded=()=>{
        const db=r.result;
        db.createObjectStore('projects',{keyPath:'id'});
        const b=db.createObjectStore('bubbles',{keyPath:'id'});
        b.createIndex('parentId','parentId');
        b.createIndex('projectId','projectId');
        db.createObjectStore('settings',{keyPath:'key'});
      };
      r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>db.close();res(new IdbStore(db))};
      r.onerror=()=>rej(r.error||new Error('Could not open storage'));
      r.onblocked=()=>rej(new Error('Storage is blocked by another tab'));
    });
  }
  _req(t,mode,fn){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction(t,mode);
      let out;
      const rq=fn(tx.objectStore(t));
      rq.onsuccess=()=>{out=rq.result};
      tx.oncomplete=()=>res(out);
      tx.onerror=()=>rej(tx.error);
      tx.onabort=()=>rej(tx.error||new Error('Storage transaction aborted'));
    });
  }
  get(t,id){return this._req(t,'readonly',s=>s.get(id))}
  getAll(t){return this._req(t,'readonly',s=>s.getAll())}
  getByIndex(t,idx,key){return this._req(t,'readonly',s=>s.index(idx).getAll(key))}
  // Resolves only after the transaction has committed, so 'saved' is honest.
  batch(ops){
    return new Promise((res,rej)=>{
      if(!ops.length)return res();
      const names=[...new Set(ops.map(o=>o.t))];
      const tx=this.db.transaction(names,'readwrite');
      for(const o of ops)tx.objectStore(o.t).put(o.v);
      tx.oncomplete=()=>res();
      tx.onerror=()=>rej(tx.error);
      tx.onabort=()=>rej(tx.error||new Error('Write aborted (storage may be full)'));
    });
  }
  close(){this.db.close()}
}

// ---------- repository: all integrity rules live here ----------
class Repo{
  constructor(store){this.s=store}

  async getSettings(){const v=await this.s.get('settings','app');return{...DEFAULT_SETTINGS,...(v||{})}}
  async saveSettings(v){await this.s.batch([{t:'settings',v:{...v,key:'app'}}])}

  async listProjects(){return(await this.s.getAll('projects')).filter(p=>!p.deletedAt).sort(byCreated)}
  async getProject(id){const p=await this.s.get('projects',id);if(!p||p.deletedAt)throw new Error('Project not found.');return p}

  async createProject(input){
    const title=cleanTitle(input.title);
    const now=Date.now();
    const circles=(await this.listProjects()).map(p=>({x:p.x,y:p.y,r:radiusFor(HOME_SIZE)}));
    const pos=findFreePosition(circles,radiusFor(HOME_SIZE));
    const projectId=newId(), rootId=newId(), colour=cleanColour(input.colour), description=cleanDesc(input.description);
    const root={id:rootId,projectId,parentId:null,title,description,colour,x:0,y:0,size:1,createdAt:now,updatedAt:now,deletedAt:null,metadata:{}};
    const project={id:projectId,title,description,colour,rootBubbleId:rootId,x:pos.x,y:pos.y,createdAt:now,updatedAt:now,deletedAt:null};
    await this.s.batch([{t:'bubbles',v:root},{t:'projects',v:project}]); // one atomic write
    return project;
  }
  async updateProject(id,input){
    const title=cleanTitle(input.title);
    const p=await this.getProject(id);
    const root=await this.s.get('bubbles',p.rootBubbleId);
    const patch={title,description:cleanDesc(input.description),colour:cleanColour(input.colour),updatedAt:Date.now()};
    const ops=[{t:'projects',v:{...p,...patch}}];
    if(root)ops.push({t:'bubbles',v:{...root,...patch}});
    await this.s.batch(ops);
  }
  async moveProject(id,x,y){const p=await this.getProject(id);await this.s.batch([{t:'projects',v:{...p,x,y,updatedAt:Date.now()}}])}
  async deleteProject(id){await this.getProject(id);return this._softDelete('projects',[id])}
  async countProjectBubbles(projectId){
    const all=(await this.s.getByIndex('bubbles','projectId',projectId)).filter(b=>!b.deletedAt);
    return Math.max(0,all.length-1); // the hidden root is not counted
  }

  async getBubble(id){const b=await this.s.get('bubbles',id);if(!b||b.deletedAt)throw new Error('Bubble not found.');return b}
  async getBubbles(ids){return Promise.all(ids.map(id=>this.getBubble(id)))}
  async listChildren(parentId){return(await this.s.getByIndex('bubbles','parentId',parentId)).filter(b=>!b.deletedAt).sort(byCreated)}

  async createBubble(parentId,input){
    const title=cleanTitle(input.title);
    const parent=await this.getBubble(parentId);
    const sibs=await this.listChildren(parentId);
    const obstacles=[{x:0,y:0,r:CORE_RADIUS},...sibs.map(s=>({x:s.x,y:s.y,r:radiusFor(s.size)}))];
    const pos=findFreePosition(obstacles,radiusFor(1));
    const now=Date.now();
    const b={id:newId(),projectId:parent.projectId,parentId,title,description:cleanDesc(input.description),colour:cleanColour(input.colour),x:pos.x,y:pos.y,size:1,createdAt:now,updatedAt:now,deletedAt:null,metadata:{}};
    await this.s.batch([{t:'bubbles',v:b}]);
    return b;
  }
  async updateBubble(id,input){
    const title=cleanTitle(input.title);
    const b=await this.getBubble(id);
    await this.s.batch([{t:'bubbles',v:{...b,title,description:cleanDesc(input.description),colour:cleanColour(input.colour),updatedAt:Date.now()}}]);
  }
  async moveBubble(id,x,y){const b=await this.getBubble(id);await this.s.batch([{t:'bubbles',v:{...b,x,y,updatedAt:Date.now()}}])}

  // Active descendants, cycle-safe, one read per project.
  async descendantIds(id){
    const b=await this.s.get('bubbles',id);
    if(!b)return[];
    const all=(await this.s.getByIndex('bubbles','projectId',b.projectId)).filter(x=>!x.deletedAt);
    const kids=new Map();
    for(const x of all){if(x.parentId){if(!kids.has(x.parentId))kids.set(x.parentId,[]);kids.get(x.parentId).push(x.id)}}
    const out=[], seen=new Set([id]);
    let frontier=[id];
    while(frontier.length){
      const next=[];
      for(const f of frontier)for(const k of(kids.get(f)||[])){if(!seen.has(k)){seen.add(k);out.push(k);next.push(k)}}
      frontier=next;
    }
    return out;
  }
  async countDescendants(id){return(await this.descendantIds(id)).length}
  async deleteBubble(id){
    const b=await this.getBubble(id);
    if(b.parentId===null)throw new Error('A project root cannot be deleted this way. Delete the project instead.');
    return this._softDelete('bubbles',[id,...(await this.descendantIds(id))]);
  }

  async validatePath(path){

    this.g={mode:'idle',id:'',sx:0,sy:0,bx:0,by:0,moved:false,long:false,timer:0,cam0:null,d0:1,k0:1,pw:null,onCore:false};

      this.cam={k:nk,x:m.x-nk*g.pw.x,y:m.y-nk*g.pw.y};this.applyCam();
    }
  }
  up(e){
    if(!this.ptrs.delete(e.pointerId))return;
    const g=this.g;
    if(g.mode==='bubble'){
      const id=g.id,tap=!g.moved&&!g.long&&e.type==='pointerup';
      this.endBubble(true);g.mode='idle';
      if(tap)this.o.onOpen(id);
    }else if(g.mode==='pan'){
      g.mode='idle';
      if(g.onCore&&!g.moved&&e.type==='pointerup'&&this.o.onCore)this.o.onCore();
      else if(g.moved||!g.onCore)this.emitCam();
    }else if(g.mode==='pinch'){
      this.emitCam();
      if(this.ptrs.size===0)g.mode='idle';
    }
  }
}

const $=s=>document.querySelector(s);

const camKey=p=>p.length?p[p.length-1]:'home';

const isPrefix=(a,b)=>a.length<=b.length&&a.every((v,i)=>b[i]===v);
function reduced(){
  const s=S.settings.reducedMotion;
  if(s==='on')return true;if(s==='off')return false;
  return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// ---------- data -> view ----------
async function loadView(path){
  if(!path.length){
    const ps=await S.repo.listProjects();
    return{uid:++S.uid,path,title:'Home',colour:DEFAULT_COLOUR,crumbs:[],
      items:ps.map(p=>({id:p.id,openId:p.rootBubbleId,title:p.title,description:p.description,colour:p.colour,x:p.x,y:p.y,size:HOME_SIZE}))};
  }
  const bs=await S.repo.getBubbles(path),tip=bs[bs.length-1],kids=await S.repo.listChildren(tip.id);
  return{uid:++S.uid,path,title:tip.title,colour:tip.colour,crumbs:bs.map(b=>b.title),
    items:kids.map(b=>({id:b.id,openId:b.id,title:b.title,description:b.description,colour:b.colour,x:b.x,y:b.y,size:b.size}))};
}
async function reloadView(){
  const cur=S.view;if(!cur)return;
  let f;try{f=await loadView(cur.path)}catch(e){console.error(e);return}
  if(S.view!==cur)return;
  S.view=f;S.ws.setItems(f.items);S.ws.setCore(f.title,f.colour);S.ws.setFloating(effFloat(f));renderChrome();

// Runs a storage write and reports honestly: 'Saved' only after the transaction committed.
async function run(fn,quiet){
  window.clearTimeout(S.statusTimer);setStatus('Saving\u2026');
  try{
    const value=await fn();
    setStatus(S.memoryOnly?'Not stored (temporary mode)':'Saved \u2713');
    S.statusTimer=window.setTimeout(()=>setStatus(''),2500);
    return{ok:true,value};
  }catch(error){
    console.error(error);setStatus('Save failed',true);
    if(!quiet)toast('Could not save: '+(error&&error.message||'unknown error'));
    try{await reloadView()}catch(_){}
    return{ok:false,error};
  }
}
function setStatus(t,err){const s=$('#status');s.textContent=t;s.className=err?'error':''}
function toast(text,actionLabel,onAction,ms){
  const box=$('#toast');window.clearTimeout(S.toastTimer);box.textContent='';
  const t=h('div',{class:'toast'},h('span',{},text));
  if(actionLabel)t.append(h('button',{type:'button',onclick:()=>{box.textContent='';window.clearTimeout(S.toastTimer);onAction&&onAction()}},actionLabel));
  box.append(t);S.toastTimer=window.setTimeout(()=>{box.textContent=''},ms||(actionLabel?9000:4500));

// ---------- navigation ----------
function viewPos(item,cam){
  const r=$('#stage').getBoundingClientRect();
  return{W:r.width||innerWidth,H:r.height||innerHeight,x:(r.width||innerWidth)/2+cam.x+item.x*cam.k,y:(r.height||innerHeight)/2+cam.y+item.y*cam.k,r:Math.max(20,radiusFor(item.size)*cam.k)};
}
function computeOrigin(kind,cur,next){
  const r=$('#stage').getBoundingClientRect(),W=r.width||innerWidth,H=r.height||innerHeight;
  const fb={x:W/2,y:H/2,r:60,colour:DEFAULT_COLOUR,W,H};
  let item,cam;
  if(kind==='enter'){item=cur.items.find(i=>i.openId===next.path[next.path.length-1]);cam=S.ws?S.ws.cam:DEFAULT_CAMERA}
  else if(kind==='back'){item=next.items.find(i=>i.openId===cur.path[cur.path.length-1]);cam=S.cams.get(camKey(next.path))||DEFAULT_CAMERA}
  if(!item)return fb;
  const p=viewPos(item,cam);return{x:p.x,y:p.y,r:p.r,colour:item.colour,W:p.W,H:p.H};
}
async function navigate(newPath,push){
  const cur=S.view;if(!cur||samePath(cur.path,newPath))return;
  const token=++S.navToken;let next;
  try{next=await loadView(newPath)}catch(e){console.error(e);toast('That bubble could not be opened.');return}
  if(token!==S.navToken)return;
  finishTransition();
  if(push)history.pushState({bm:1,path:newPath},'');
  const kind=newPath.length>cur.path.length&&isPrefix(cur.path,newPath)?'enter':newPath.length<cur.path.length&&isPrefix(newPath,cur.path)?'back':'swap';
  const origin=computeOrigin(kind,cur,next),oldWs=S.ws;
  oldWs.freeze();
  S.cams.set(camKey(cur.path),{...oldWs.cam});
  S.view=next;S.ws=mountWorkspace(next);
  renderChrome();setStatus('');
  runTransition(kind,origin,oldWs,S.ws);
}
function mountWorkspace(v){
  const key=camKey(v.path);
  const ws=new Workspace({
    items:v.items,showCore:v.path.length>0,coreTitle:v.title,coreColour:v.colour,
    camera:S.cams.get(key)||DEFAULT_CAMERA,floating:effFloat(v),
    onOpen:openItem,onMenu:openItemMenu,onMove:onMoveItem,onCore:openCoreMenu,
    onCamera:c=>{S.cams.set(key,c);updateRecenter()}
  });
  $('#stage').insertBefore(ws.root,$('#ripple'));
  return ws;
}
function runTransition(kind,o,oldWs,newWs){
  const leaveEl=oldWs.root,enterEl=newWs.root,rip=$('#ripple');
  S.trans={oldWs,newWs,anims:[],timer:0};
  if(typeof enterEl.animate!=='function'){finishTransition();return}
  const opt=(d,delay,ease)=>({duration:d,delay:delay||0,easing:ease||'cubic-bezier(.5,0,.2,1)',fill:'both'});
  const A=S.trans.anims;
  if(reduced()||kind==='swap'){
    A.push(leaveEl.animate([{opacity:1},{opacity:0}],opt(130)),enterEl.animate([{opacity:0},{opacity:1}],opt(170)));
  }else if(kind==='enter'){
    leaveEl.style.transformOrigin=o.x+'px '+o.y+'px';enterEl.style.transformOrigin='50% 50%';
    A.push(leaveEl.animate([{transform:'scale(1)',opacity:1},{transform:'scale(3.4)',opacity:0}],opt(720,0,'cubic-bezier(.55,0,.35,1)')));
    A.push(enterEl.animate([{transform:'scale(.55)',opacity:0},{transform:'scale(1)',opacity:1}],opt(620,200,'cubic-bezier(.2,.7,.2,1)')));
    const far=Math.hypot(Math.max(o.x,o.W-o.x),Math.max(o.y,o.H-o.y));
    rip.style.cssText='display:block;left:'+(o.x-o.r)+'px;top:'+(o.y-o.r)+'px;width:'+(o.r*2)+'px;height:'+(o.r*2)+'px;--c:'+o.colour;
    A.push(rip.animate([{transform:'scale(1)',opacity:.75},{transform:'scale('+(far/o.r*1.15)+')',opacity:0}],opt(760,0,'cubic-bezier(.4,0,.2,1)')));
  }else{
    leaveEl.style.transformOrigin='50% 50%';enterEl.style.transformOrigin=o.x+'px '+o.y+'px';
    A.push(leaveEl.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.45)',opacity:0}],opt(560,0,'cubic-bezier(.5,0,.8,.4)')));
    A.push(enterEl.animate([{transform:'scale(2.6)',opacity:0},{transform:'scale(1)',opacity:1}],opt(620,60,'cubic-bezier(.2,.7,.2,1)')));
  }
  const t=S.trans;
  Promise.all(A.map(a=>a.finished)).then(()=>{if(S.trans===t)finishTransition()},()=>{});
  t.timer=window.setTimeout(()=>{if(S.trans===t)finishTransition()},1400);
}
function finishTransition(){
  const t=S.trans;if(!t)return;S.trans=null;window.clearTimeout(t.timer);
  for(const a of t.anims){try{a.cancel()}catch(_){}}
  t.oldWs.destroy();t.newWs.root.style.transformOrigin='';
  $('#ripple').style.display='none';
}

function openItem(id){
  const cur=S.view;if(!cur||S.overlay)return;
  const it=cur.items.find(i=>i.id===id);if(!it)return;

function jumpTo(depth){
  const cur=S.view;if(!cur||depth>=cur.path.length||depth<0)return;

    if(S.view===cur){history.replaceState({bm:1,path:target},'');navigate(target,false)}
  },450);
}
const goBack=()=>{if(S.view&&S.view.path.length)jumpTo(S.view.path.length-1)};

async function onPopState(e){
  if(S.ignorePop){S.ignorePop=false;return}
  if(S.overlay){closeOverlay();S.ignorePop=true;history.go(1);return} // Back closes a dialog first
  const st=e.state;

  let path=st&&Array.isArray(st.path)?st.path:[];

}

function openOverlay(title,variant,dismiss,build){
  closeOverlay();
  const prev=document.activeElement;
  const bd=h('div',{class:'backdrop '+(variant==='sheet'?'sheet':'')});
  const box=h('div',{class:'dialog',role:'dialog','aria-modal':'true','aria-label':title,tabindex:'-1'},h('h2',{},title));
  bd.append(box);$('#overlay').append(bd);
  const focusables=()=>[...box.querySelectorAll('button,input,textarea,[tabindex]:not([tabindex="-1"])')].filter(e=>!e.disabled);
  const onKey=e=>{
    if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeOverlay();return}
    if(e.key!=='Tab')return;
    const f=focusables();if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  };
  document.addEventListener('keydown',onKey,true);
  if(dismiss)bd.addEventListener('pointerdown',e=>{if(e.target===bd)closeOverlay()});
  S.overlay={bd,onKey,prev};
  build(box,closeOverlay);
  (box.querySelector('[data-autofocus]')||focusables()[0]||box).focus();
}
function closeOverlay(){
  const o=S.overlay;if(!o)return;S.overlay=null;
  document.removeEventListener('keydown',o.onKey,true);o.bd.remove();
  try{o.prev&&o.prev.focus&&o.prev.focus()}catch(_){}
}

    let path=[];const st=history.state;
    if(st&&st.bm&&Array.isArray(st.path)){
      if(await S.repo.validatePath(st.path))path=st.path;else history.replaceState({bm:1,path:[]},'');
    }else if(st&&st.bm&&st.sentinel){history.pushState({bm:1,path:[]},'')}
    else{history.replaceState({bm:1,sentinel:true},'');history.pushState({bm:1,path:[]},'')}
    S.view=await loadView(path);S.ws=mountWorkspace(S.view);renderChrome();

    window.addEventListener('popstate',onPopState);
    $('#begin').addEventListener('click',()=>{
      const b=$('#begin');b.classList.remove('tap');void b.offsetWidth;b.classList.add('tap');
      window.setTimeout(()=>{if(!S.overlay)openCreate()},200);
    });
    $('#fab').addEventListener('click',()=>{if(!S.overlay)openCreate()});
    $('#backBtn').addEventListener('click',goBack);
    $('#floatBtn').addEventListener('click',()=>changeSettings({floatingEnabled:!S.settings.floatingEnabled}));
    $('#settingsBtn').addEventListener('click',()=>{if(!S.overlay)openSettings()});
    $('#recenter').addEventListener('click',()=>S.ws.resetView());
    document.addEventListener('keydown',e=>{
      if(e.key!=='Escape'||S.overlay||e.defaultPrevented)return;
      const t=e.target;if(t&&/^(INPUT|TEXTAREA)$/.test(t.tagName))return;
      goBack();
    });
    if(window.matchMedia){
      for(const q of['(prefers-color-scheme: light)','(prefers-reduced-motion: reduce)']){
        const mq=window.matchMedia(q);if(mq.addEventListener)mq.addEventListener('change',applySettings);
      }
    }
    // Every write is committed to IndexedDB before the UI says 'Saved', so there is nothing to flush on close.
    window.__bm={S};
    if(location.hash==='#selftest')showSelfTests();
  }catch(err){
    console.error(err);
    showBanner('Bubble Mind could not start: '+(err&&err.message||err)+'. Your stored data has not been touched.');
  }
}
if(typeof document!=='undefined'&&document.getElementById('app'))init();
// </INIT>
</script>
</body>
</html>
