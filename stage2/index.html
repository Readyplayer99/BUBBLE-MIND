/* Stage 2 enhancements — isolated from both older releases. */
:root {--map-size: 112px}
.stage2-label{display:inline-block;margin-left:8px;padding:3px 7px;border-radius:7px;background:#31456e;color:#d7e6ff;font-size:10px;vertical-align:middle;letter-spacing:0}
.map-controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:12px 0 6px}
.map-control{border:1px solid rgba(175,195,242,.24);border-radius:11px;background:#202c4f;color:#dce5ff;padding:9px 11px;min-height:40px;font-size:12px}
.map-control.active{background:#465f9e;border-color:#adc5ff;color:#fff}
.map-viewport{margin:15px auto 4px;position:relative;flex:1;min-height:480px;height:min(63dvh,730px);width:100%;max-width:100%;overflow:hidden;border:1px solid #798eba34;border-radius:18px;touch-action:none;background:radial-gradient(ellipse at 50% 50%,#202b52ab,#0a112b22 60%,transparent 84%)}
.map-viewport::after{content:'';pointer-events:none;position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 0 40px #02061366}
.map-canvas{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0;will-change:transform}
.map-svg{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px;pointer-events:none}
.map-node{position:absolute;left:0;top:0;width:112px;height:112px;transform:translate(-56px,-56px);touch-action:none;user-select:none}
.map-node .bubble{--bubble-size:112px;width:112px;height:112px;touch-action:none;cursor:grab;animation:none}
.map-node .bubble-floating{animation:bob 6s ease-in-out infinite}
.map-node.dragged .bubble{cursor:grabbing;filter:brightness(1.25);animation:none;box-shadow:0 0 40px #8cafff66}
.map-centre{position:absolute;left:-77px;top:-77px;width:154px;height:154px;z-index:3}
.map-centre .bubble{width:154px;height:154px;--bubble-size:154px}
.map-centre .bubble-label{font-size:16px}
.map-center-label{font-size:10px;color:#d6dcff;opacity:.82}

function orbitPosition(i,n){const ring=Math.floor(Math.sqrt(i/7)),start=ring*ring*7,end=(ring+1)*(ring+1)*7,slots=Math.min(n,end)-start,idx=i-start;const angle=-Math.PI/2+2*Math.PI*(idx/Math.max(1,slots));const radius=150+ring*150;return{x:Math.round(radius*Math.cos(angle)),y:Math.round(radius*Math.sin(angle))}}
function applyPan(){if(!canvas)return;const p=state.pan;canvas.style.transform=`translate(${p.x}px,${p.y}px) scale(${p.k})`}
function updateMapLinks(){if(!svg)return;svg.replaceChildren();const parent=state.currentId;for(const [nodeId,p] of display){const line=document.createElementNS('http://www.w3.org/2000/svg','line');for(const [k,v] of Object.entries({x1:0,y1:0,x2:p.x,y2:p.y,stroke:'#8da5df','stroke-opacity':'.4','stroke-width':1.7}))line.setAttribute(k,v);line.classList.add('map-link');svg.append(line)}for(const link of state.links){const a=link.from===parent?{x:0,y:0}:display.get(link.from);const b=link.to===parent?{x:0,y:0}:display.get(link.to);if(!a||!b)continue;const line=document.createElementNS('http://www.w3.org/2000/svg','line');for(const [k,v] of Object.entries({x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:link.color||'#d5a1ee','stroke-opacity':'.85','stroke-width':2.4}))line.setAttribute(k,v);line.classList.add('map-link','extra');svg.append(line);if(link.label){const text=document.createElementNS('http://www.w3.org/2000/svg','text');text.setAttribute('x',(a.x+b.x)/2);text.setAttribute('y',(a.y+b.y)/2-8);text.setAttribute('text-anchor','middle');text.setAttribute('class','map-link-label');text.textContent=link.label;svg.append(text)}}}
function renderInside(){const parent=byId(state.currentId);if(!parent){state.currentId=null;return renderHome()}const tools=el('div','map-controls');tools.append(el('span','help-text','Layout:'));for(const [mode,label] of [['orbit','Orbit'],['grid','Grid'],['free','Free']]){const b=btn(label,'map-control'+(state.layout===mode?' active':''),()=>change(()=>{if(mode==='free'&&state.layout!=='free'){const positions=layoutPositions(kids(state.currentId));for(const n of kids(state.currentId)){const p=positions.get(n.id);n.x=p.x;n.y=p.y}}state.layout=mode},`Layout: ${label}`));b.setAttribute('aria-pressed',String(state.layout===mode));tools.append(b)}tools.append(btn('Undo','map-control',undo),btn('Redo','map-control',redo));refs.world.append(tools);
 viewport=el('div','map-viewport');viewport.setAttribute('aria-label','Idea mind map');canvas=el('div','map-canvas');svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('map-svg');canvas.append(svg);const centre=el('div','map-centre');const c=bubbleButton(parent,'bubble-focus');c.onclick=null;c.addEventListener('click',e=>{e.stopImmediatePropagation();editNode(parent.id)},true);centre.append(c);centre.append(btn('✎','map-chip',()=>editNode(parent.id)));canvas.append(centre);
 const children=kids(parent.id),positions=layoutPositions(children);display=new Map();children.forEach((n)=>{const p=positions.get(n.id);display.set(n.id,p);const slot=el('div','map-node');slot.dataset.id=n.id;slot.style.transform=`translate(${p.x-56}px,${p.y-56}px)`;const bub=bubbleButton(n);bub.classList.toggle('bubble-floating',state.motion&&!reduced());slot.append(bub,btn('⋯','map-chip',()=>editNode(n.id)));canvas.append(slot);wireDrag(slot,n,p)});viewport.append(canvas);const panHelp=el('p','map-pan-help','Drag empty space to pan · Scroll or pinch to zoom');const reset=btn('Center view','map-control map-reset',()=>{state.pan={x:0,y:0,k:1};applyPan()});viewport.append(reset);refs.world.append(viewport,panHelp);applyPan();updateMapLinks();wirePan(viewport);
 const stats=el('div','map-summary',`${children.length} child bubbles · ${state.links.filter(l=>l.from===parent.id||l.to===parent.id||display.has(l.from)&&display.has(l.to)).length} labelled links`);refs.world.append(stats);
 const bar=el('div','map-toolbar');bar.append(btn('＋ Add a bubble','soft-button',()=>addNode(parent.id)),btn('✎ Edit central idea','soft-button',()=>editNode(parent.id)),btn('↔ Relationships','soft-button',()=>connections(parent.id)),btn('← Back','soft-button',()=>navigate(parent.parentId)));refs.world.append(bar);refs.world.append(el('p','map-help','Tap to enter · Tab creates a child · ⋯ to edit, duplicate, move or connect · Free layout allows dragging'))}
function wireDrag(slot,n,initial){const bubble=slot.querySelector('.bubble');let moving=false,sx=0,sy=0,bx=initial.x,by=initial.y,pid=-1;const start=e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.stopPropagation();moving=false;sx=e.clientX;sy=e.clientY;pid=e.pointerId;bx=display.get(n.id).x;by=display.get(n.id).y;try{bubble.setPointerCapture(pid)}catch(_){}};const move=e=>{if(pid!==e.pointerId)return;e.stopPropagation();const dx=(e.clientX-sx)/state.pan.k,dy=(e.clientY-sy)/state.pan.k;if(!moving&&Math.hypot(dx,dy)<8)return;if(!moving){moving=true;record();slot.classList.add('dragged');if(state.layout!=='free'){const p=new Map(display);state.layout='free';for(const node of kids(state.currentId)){const pos=p.get(node.id);node.x=pos.x;node.y=pos.y}refs.world.querySelectorAll('.map-control').forEach(b=>{if(['Orbit','Grid','Free'].includes(b.textContent))b.classList.toggle('active',b.textContent==='Free')})}}const p={x:Math.round(bx+dx),y:Math.round(by+dy)};display.set(n.id,p);n.x=p.x;n.y=p.y;slot.style.transform=`translate(${p.x-56}px,${p.y-56}px)`;updateMapLinks()};const end=e=>{if(pid!==e.pointerId)return;e.stopPropagation();pid=-1;slot.classList.remove('dragged');if(moving){moving=false;state.dragHappened=true;state.future=[];persist();setTimeout(()=>{state.dragHappened=false},100);toast('Position saved');render()}else{navigate(n.id)}};bubble.addEventListener('pointerdown',start);bubble.addEventListener('pointermove',move);bubble.addEventListener('pointerup',end);bubble.addEventListener('pointercancel',()=>{pid=-1;moving=false;slot.classList.remove('dragged')});bubble.addEventListener('click',e=>{e.stopImmediatePropagation();e.preventDefault()},true);bubble.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();navigate(n.id)}});bubble.addEventListener('contextmenu',e=>{e.preventDefault();editNode(n.id)})}
function wirePan(view){let pointers=new Map(),start=null,zoomStart=null;view.addEventListener('pointerdown',e=>{if(e.target.closest('.map-node,.map-centre,button'))return;view.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)start={x:e.clientX,y:e.clientY,panX:state.pan.x,panY:state.pan.y};if(pointers.size===2){const [a,b]=[...pointers.values()];zoomStart={distance:Math.hypot(a.x-b.x,a.y-b.y),k:state.pan.k}}});view.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&start){state.pan.x=start.panX+e.clientX-start.x;state.pan.y=start.panY+e.clientY-start.y;applyPan()}else if(pointers.size===2&&zoomStart){const [a,b]=[...pointers.values()];state.pan.k=Math.max(.35,Math.min(2.4,zoomStart.k*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,zoomStart.distance)));applyPan()}});const end=e=>{pointers.delete(e.pointerId);if(pointers.size!==1)start=null;if(!pointers.size)zoomStart=null};view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);view.addEventListener('wheel',e=>{if(e.target.closest('button'))return;e.preventDefault();state.pan.k=Math.max(.35,Math.min(2.4,state.pan.k*Math.exp(-e.deltaY*.001)));applyPan()},{passive:false})}
function render(){viewport=null;canvas=null;svg=null;display=new Map();renderHeader();refs.world.replaceChildren();state.currentId?renderInside():renderHome()}
refs.motion.addEventListener('click',()=>{const next=!state.motion;change(()=>state.motion=next,next?'Floating enabled':'Floating paused')});
$('new-button').addEventListener('click',()=>addNode(state.currentId));
// Tab is a child-node shortcut only while exploring bubbles. It must never trap focus in forms or toolbars.
function tabChildTarget(target){
 const node=target?.closest?.('button.bubble[data-node-id]');
 if(node?.dataset.nodeId&&byId(node.dataset.nodeId))return node.dataset.nodeId;
 const mapFocus=target===document.body||target===document.documentElement||!!target?.closest?.('.map-viewport');
 return state.currentId&&mapFocus?state.currentId:null;
}
document.addEventListener('keydown',e=>{
 const target=e.target;
 if(e.key==='Escape'&&refs.overlay.firstChild){e.preventDefault();close();return}
 if(target?.closest?.('input,textarea,select,[contenteditable]')||refs.overlay.firstChild)return;
 if(e.key==='Tab'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.repeat&&!state.transition){
  const parentId=tabChildTarget(target);
  if(parentId){e.preventDefault();addNode(parentId);return}
 }
 if(e.key==='Escape'&&state.currentId){e.preventDefault();navigate(byId(state.currentId)?.parentId||null)}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)redo();else undo()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
});
