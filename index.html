    crumbs: document.getElementById('crumbs'),
    overlay: document.getElementById('overlay-root'),
    portal: document.getElementById('portal-root'),
    toast: document.getElementById('toast'),
    motion: document.getElementById('motion-button'),
    saveStatus: document.getElementById('save-status')
  };
  let toastTimer;
  let linesObserver;

  function element(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function find(id) { return state.nodes.find(n => n.id === id) || null; }
  function childrenOf(id) { return state.nodes.filter(n => n.parentId === id); }
  function makeId() {
    if (globalThis.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    return 'idea-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  }
  function reducedMotion() { return matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function normaliseData(data) {
    if (!data || !Array.isArray(data.nodes)) return;
    const ids = new Set();
    const candidates = data.nodes.slice(0, 1500).filter(n => {
      if (!n || typeof n.id !== 'string' || !n.id || ids.has(n.id) || typeof n.title !== 'string') return false;
      ids.add(n.id);
      return true;
    });
    state.nodes = candidates.map((n, idx) => ({
      id: n.id,
      parentId: typeof n.parentId === 'string' && n.parentId !== n.id && ids.has(n.parentId) ? n.parentId : null,
      title: n.title.trim().slice(0, 80) || 'Untitled idea',
      color: PALETTE.includes(n.color) ? n.color : PALETTE[idx % PALETTE.length]
    }));
    state.motion = data.motion !== false;
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) normaliseData(JSON.parse(raw));
    } catch (error) {
      refs.saveStatus.textContent = 'Saving unavailable in this preview';
      console.warn('Local storage unavailable:', error);
    }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, nodes: state.nodes, motion: state.motion }));
      refs.saveStatus.textContent = 'Saved on this device';
    } catch (error) {
      refs.saveStatus.textContent = 'Saving unavailable in this preview';
      showToast('This preview cannot save. Open the app in Chrome from a hosted link.');
    }
  }
  function showToast(message) {
    clearTimeout(toastTimer);
    refs.toast.textContent = message;
    refs.toast.classList.add('visible');
    toastTimer = setTimeout(() => refs.toast.classList.remove('visible'), 2500);
  }
  function getPath(id) {
    const path = [];
    let node = find(id);
    const visited = new Set();
    while (node && !visited.has(node.id)) {
      visited.add(node.id);
      path.unshift(node);
      node = find(node.parentId);
    }
    return path;
  }
  function actionButton(label, cls, handler) {
    const button = element('button', cls, label);
    button.type = 'button';
    button.addEventListener('click', handler);
    return button;
  }

  function renderCrumbs() {
    refs.crumbs.replaceChildren();
    const path = getPath(state.currentId);
    if (!path.length) {
      refs.crumbs.append(element('span', 'crumb-current', 'Home / Your ideas'));
      return;
    }
    const home = actionButton('Home', 'crumb-link', () => navigateTo(null, { backward: true }));
    refs.crumbs.append(home);
    for (const [index, node] of path.entries()) {
      refs.crumbs.append(element('span', 'crumb-divider', '›'));
      if (index === path.length - 1) {
        refs.crumbs.append(element('span', 'crumb-current', node.title));
      } else {
        refs.crumbs.append(actionButton(node.title, 'crumb-link', () => navigateTo(node.id, { backward: true })));
      }
    }
  }
  function renderIntro() {
    refs.intro.replaceChildren();
    const current = find(state.currentId);
    const label = current ? 'EXPLORE YOUR IDEA' : 'YOUR SPACE TO IMAGINE';
    const title = current ? current.title : (state.nodes.length ? 'Your ideas, in motion.' : 'Every universe begins with a thought.');
    const summary = current ? 'Step into another bubble, or start a new thought inside this one.'
      : state.nodes.length ? 'Tap a bubble to step inside. Every idea can grow into its own universe.'
        : 'A blank space, full of possibility. Tap the bubble below to begin.';
    refs.intro.append(element('p', 'eyebrow', label));
    refs.intro.append(element('h1', '', title));
    refs.intro.append(element('p', 'sub', summary));
  }

  function makeBubble(node, options = {}) {
    const size = options.size || '';
    const slot = element('div', 'bubble-slot');
    const bubble = actionButton('', 'bubble ' + size + (state.motion ? ' bubble-floating' : ''), () => navigateTo(node.id, { origin: bubble }));
    bubble.style.setProperty('--bubble-color', node.color);
    bubble.style.setProperty('--drift-time', `${5.8 + (node.title.length % 4) * .55}s`);
    bubble.style.setProperty('--drift-delay', `-${(node.title.length % 6) * .7}s`);
    bubble.setAttribute('aria-label', `Enter ${node.title}`);
    bubble.append(element('span', 'bubble-label', node.title));
    const num = childrenOf(node.id).length;
    if (num) bubble.append(element('span', 'bubble-sub', `${num} ${num === 1 ? 'thought' : 'thoughts'}`));
    slot.append(bubble);
    if (options.editable !== false) {
      const edit = element('button', 'bubble-edit');
      edit.type = 'button';
      edit.setAttribute('aria-label', `Rename or remove ${node.title}`);
      edit.title = 'Rename or remove';
      edit.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19h8M4 17.5V20h3.5L19.4 8.1a2.1 2.1 0 0 0-3-3L4 16.5z"/></svg>';
      edit.addEventListener('click', () => openEdit(node.id));
      slot.append(edit);
    }
    return slot;
  }
  function makeCreateBubble(parentId, small = false) {
    const slot = element('div', 'bubble-slot');
    const bubble = actionButton('', 'bubble bubble-create ' + (small ? 'bubble-small ' : '') + (state.motion ? 'bubble-floating' : ''), () => openCreate(parentId));
    bubble.setAttribute('aria-label', 'Begin a new idea');
    bubble.append(element('span', 'create-plus', '+'));
    bubble.append(element('span', 'bubble-label', parentId ? 'Add a thought' : 'Begin an idea'));
    slot.append(bubble);
    return slot;
  }
  function renderHome() {
    if (!state.nodes.length) {
      const area = element('div', 'empty-world');
      area.append(makeCreateBubble(null));
      area.append(element('div', 'empty-hint', 'A single thought can become a whole universe.'));
      refs.world.append(area);
      return;
    }
    const grid = element('div', 'home-grid');
    childrenOf(null).forEach(node => grid.append(makeBubble(node, { size: 'bubble-home' })));
    grid.append(makeCreateBubble(null, true));
    refs.world.append(grid);
  }
  function renderInside() {
    const here = find(state.currentId);
    if (!here) { state.currentId = null; renderHome(); return; }
    const constellation = element('section', 'constellation');
    constellation.setAttribute('aria-label', `Inside ${here.title}`);
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('connection-lines');
    svg.setAttribute('aria-hidden', 'true');
    constellation.append(svg);
    const focusStage = element('div', 'focus-stage');
    const current = element('div', 'bubble bubble-focus' + (state.motion ? ' bubble-floating' : ''));
    current.style.setProperty('--bubble-color', here.color);
    current.append(element('span', 'bubble-label', here.title));
    current.append(element('span', 'bubble-sub', 'YOU ARE HERE'));
    focusStage.append(current);
    constellation.append(focusStage);

    const kids = childrenOf(here.id);
    if (!kids.length) {
      const hint = element('div', 'child-placeholder');
      hint.append(element('span', '', 'A new world can start here.'));
      constellation.append(hint);
      const empty = element('div', 'empty-world');
      empty.style.minHeight = '175px';
      empty.append(makeCreateBubble(here.id));
      constellation.append(empty);
    } else {
      const grid = element('div', 'child-grid');
      kids.forEach(node => grid.append(makeBubble(node, { size: 'bubble-small' })));
      grid.append(makeCreateBubble(here.id, true));
      constellation.append(grid);
    }
    const tools = element('div', 'floating-action-strip');
    tools.append(actionButton('← Back one level', 'soft-button', () => navigateTo(here.parentId, { backward: true })));
    tools.append(actionButton('Rename this idea', 'soft-button', () => openEdit(here.id)));
    constellation.append(tools);
    refs.world.append(constellation);
    if (linesObserver) linesObserver.disconnect();
    const draw = () => drawLines(constellation, svg);
    requestAnimationFrame(draw);
    if (typeof ResizeObserver !== 'undefined') {
      linesObserver = new ResizeObserver(draw);
      linesObserver.observe(constellation);
    }
  }
  function drawLines(container, svg) {
    if (!container.isConnected) return;
    const root = container.getBoundingClientRect();
    const centre = container.querySelector('.bubble-focus');
    if (!centre) return;
    const first = centre.getBoundingClientRect();
    const x1 = first.left + first.width / 2 - root.left;
    const y1 = first.top + first.height / 2 - root.top;
    const lineData = [];
    container.querySelectorAll('.child-grid .bubble:not(.bubble-create)').forEach(bubble => {
      const dest = bubble.getBoundingClientRect();
      lineData.push([dest.left + dest.width / 2 - root.left, dest.top + dest.height / 2 - root.top]);
    });
    svg.setAttribute('viewBox', `0 0 ${Math.max(1, root.width)} ${Math.max(1, root.height)}`);
    svg.replaceChildren();
    lineData.forEach(([x2, y2]) => {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      for (const [k, v] of Object.entries({ x1, y1, x2, y2, stroke: '#8da5df', 'stroke-width': '1.6', 'stroke-opacity': '.38' })) line.setAttribute(k, String(v));
      svg.append(line);
    });
  }
  function render() {
    if (linesObserver) linesObserver.disconnect();
    refs.motion.classList.toggle('selected', state.motion);
    refs.motion.setAttribute('aria-pressed', String(state.motion));
    refs.motion.title = state.motion ? 'Turn floating off' : 'Turn floating on';
    renderCrumbs();
    renderIntro();
    refs.world.replaceChildren();
    state.currentId ? renderInside() : renderHome();
  }

  async function portalTransition(origin, destinationId, backward) {
    if (state.transition) return;
    state.transition = true;
    const animate = !reducedMotion();
    const original = origin?.getBoundingClientRect?.();
    const duration = 410;
    if (!animate || (!original && !backward)) {
      state.currentId = destinationId;
      render();
      state.transition = false;
      return;
    }
    const colour = origin?.style?.getPropertyValue('--bubble-color') || '#9bb5ff';
    const circle = element('div', 'portal');
    circle.style.setProperty('--portal-color', colour);
    refs.portal.append(circle);
    try {
      if (!backward && original) {
        const cx = innerWidth / 2, cy = innerHeight / 2;
        const scale = Math.max(innerWidth / original.width, innerHeight / original.height) * 2.3;
        circle.style.left = `${original.left}px`;
        circle.style.top = `${original.top}px`;
        circle.style.width = `${original.width}px`;
        circle.style.height = `${original.height}px`;
        const animation = circle.animate([
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: `translate(${cx - original.left - original.width / 2}px, ${cy - original.top - original.height / 2}px) scale(${scale})`, opacity: 1 }
        ], { duration, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
        await animation.finished;
        state.currentId = destinationId;
        render();
      } else {
        // Render the destination behind a full-screen portal, then shrink into its bubble.
        state.currentId = destinationId;
        render();
        const target = destinationId === null
          ? refs.world.querySelector('.bubble-home') || refs.world.querySelector('.bubble-create')
          : refs.world.querySelector('.bubble-focus');
        const rect = target?.getBoundingClientRect();
        if (rect) {
          const radius = Math.max(innerWidth, innerHeight) * 1.7;
          const big = radius * 2;
          circle.style.width = `${big}px`;
          circle.style.height = `${big}px`;
          circle.style.left = `${rect.left + rect.width / 2 - radius}px`;
          circle.style.top = `${rect.top + rect.height / 2 - radius}px`;
          const scale = rect.width / big;
          await circle.animate([
            { transform: 'scale(1)', opacity: 1 },
            { transform: `scale(${scale})`, opacity: .8 }
          ], { duration, easing: 'cubic-bezier(.3,.0,.15,1)', fill: 'forwards' }).finished;
        }
      }
      await circle.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, fill: 'forwards' }).finished;
    } catch (error) {
      state.currentId = destinationId;
      render();
    } finally {
      circle.remove();
      state.transition = false;
    }
  }
  function navigateTo(id, options = {}) {
    if (state.transition || id === state.currentId) return;
    if (id !== null && !find(id)) return;
    const backward = !!options.backward;
    const origin = options.origin || (backward ? refs.world.querySelector('.bubble-focus') : null);
    history.pushState({ bubbleMind: true, id }, '');
    void portalTransition(origin, id, backward);
  }

  function closeOverlay() {
    refs.overlay.replaceChildren();
    document.body.classList.remove('dialog-open');
  }
  function openDialog(title, description, builder) {
    closeOverlay();
    const wrap = element('div', 'overlay');
    wrap.addEventListener('mousedown', evt => { if (evt.target === wrap) closeOverlay(); });
    const dialog = element('div', 'dialog');
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-modal', 'true');
    const heading = element('h2', '', title);
    heading.id = 'dialog-title';
    dialog.setAttribute('aria-labelledby', heading.id);
    dialog.append(heading);
    dialog.append(element('p', 'dialog-sub', description));
    builder(dialog);
    wrap.append(dialog);
    refs.overlay.append(wrap);
    document.body.classList.add('dialog-open');
    dialog.querySelector('input')?.focus();
  }
  function fieldInput(name, value = '') {
    const label = element('label', 'field-label', name);
    label.setAttribute('for', 'bubble-name');
    const input = element('input', 'text-field');
    input.id = 'bubble-name';
    input.maxLength = 80;
    input.required = true;
    input.autocomplete = 'off';
    input.placeholder = 'Give your thought a name';
    input.value = value;
    return { label, input };
  }
  function openCreate(parentId) {
    if (state.transition) return;
    const parent = find(parentId);
    openDialog(parent ? 'Start a new thought' : 'Begin an idea',
      parent ? `This bubble will live inside “${parent.title}”.` : 'Give your idea a name. You can explore it once it appears.', dialog => {
        const form = element('form');
        const { label, input } = fieldInput('Idea name');
        form.append(label, input);
        const actions = element('div', 'form-actions');
        actions.append(actionButton('Cancel', 'ghost-button', closeOverlay));
        const create = element('button', 'primary-button', 'Create bubble');
        create.type = 'submit';
        actions.append(create);
        form.append(actions);
        form.addEventListener('submit', event => {
          event.preventDefault();
          const title = input.value.trim();
          if (!title) { input.focus(); return; }
          state.nodes.push({ id: makeId(), parentId, title, color: PALETTE[state.nodes.length % PALETTE.length] });
          save();
          closeOverlay();
          render();
          showToast(`Created “${title}”`);
        });
        dialog.append(form);
      });
  }
  function descendants(id) {
    const ids = new Set([id]);
    let previousSize = 0;
    while (ids.size !== previousSize) {
      previousSize = ids.size;
      for (const node of state.nodes) if (ids.has(node.parentId)) ids.add(node.id);
    }
    return ids;
  }
  function openEdit(id) {
    const node = find(id);
    if (!node) return;
    openDialog('Rename your idea', 'Change the bubble name, or remove this test idea.', dialog => {
      const form = element('form');
      const { label, input } = fieldInput('Idea name', node.title);
      form.append(label, input);
      const actions = element('div', 'form-actions');
      actions.append(actionButton('Cancel', 'ghost-button', closeOverlay));
      const submit = element('button', 'primary-button', 'Save name');
      submit.type = 'submit';
      actions.append(submit);
      form.append(actions);
      form.addEventListener('submit', event => {
        event.preventDefault();
        const newName = input.value.trim();
        if (!newName) return;
        node.title = newName;
        save();
        closeOverlay();
        render();
        showToast('Bubble renamed');
      });
      dialog.append(form);
      const deleteButton = actionButton('Remove this bubble', 'danger-button', () => {
        const ids = descendants(id);
        if (!confirm(`Remove “${node.title}” and all ${ids.size - 1} nested thoughts? This cannot be undone.`)) return;
        state.nodes = state.nodes.filter(n => !ids.has(n.id));
        if (ids.has(state.currentId)) state.currentId = node.parentId;
        save();
        closeOverlay();
        render();
        showToast('Bubble removed');
      });
      deleteButton.style.marginTop = '12px';
      dialog.append(deleteButton);
    });
  }

  refs.motion.addEventListener('click', () => {
    state.motion = !state.motion;
    save();
    render();
    showToast(state.motion ? 'Floating enabled' : 'Floating paused');
  });
  document.getElementById('new-button').addEventListener('click', () => openCreate(state.currentId));
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    if (refs.overlay.childElementCount) closeOverlay();
    else if (state.currentId !== null) navigateTo(find(state.currentId)?.parentId ?? null, { backward: true });
  });
  window.addEventListener('popstate', event => {
    const id = event.state?.bubbleMind ? event.state.id : null;
    if (id === state.currentId) return;
    const target = id !== null && find(id) ? id : null;
    void portalTransition(refs.world.querySelector('.bubble-focus'), target, true);
  });

  load();
  // On every fresh launch start at Home, even if the user closed the app deep inside an idea.
  history.replaceState({ bubbleMind: true, id: null }, '');
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();

  </script>
</body>
</html>
