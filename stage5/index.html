/* Stage 2 enhancements — isolated from both older releases. */
:root {--map-size: 112px}
.stage2-label{display:inline-block;margin-left:8px;padding:3px 7px;border-radius:7px;background:#31456e;color:#d7e6ff;font-size:10px;vertical-align:middle;letter-spacing:0}
.map-controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:12px 0 6px}
.map-control{border:1px solid rgba(175,195,242,.24);border-radius:11px;background:#202c4f;color:#dce5ff;padding:9px 11px;min-height:40px;font-size:12px}
.map-control.active{background:#465f9e;border-color:#adc5ff;color:#fff}
.map-viewport{margin:15px auto 4px;position:relative;flex:1;min-height:480px;height:min(63dvh,730px);width:100%;max-width:100%;overflow:hidden;border:1px solid #798eba34;border-radius:18px;touch-action:none;background:radial-gradient(ellipse at 50% 50%,#202b52ab,#0a112b22 60%,transparent 84%)}
.map-viewport::after{content:'';pointer-events:none;position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 0 40px #02061366}
.map-canvas{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0;will-change:transform}
.map-svg{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px;pointer-events:none}
.map-node{position:absolute;left:0;top:0;width:112px;height:112px;transform:translate(-56px,-56px);touch-action:none;user-select:none}
.map-node .bubble{width:var(--bubble-size,112px);height:var(--bubble-size,112px);touch-action:none;cursor:grab;animation:none}

  <script>
document.getElementById("preview-fallback")?.remove();
/* Bubble Mind Stage 5 foundation. Independent copy of the approved Stage 4 mobile layout.
   Deliberately does NOT use, modify, or import the user's original application. */
(()=>{'use strict';
const KEY='bubble-mind-stage5-v1',STAGE1_KEY='bubble-mind-stage4-mobile-v1',PALETTE=['#9bb5ff','#8bd8ca','#d5a1ee','#f0c180','#ee9da9','#9fce97','#73c6ed','#f18ec6'];
const state={nodes:[],links:[],notes:{},subnodes:[],motion:true,motionOverride:false,homeStatic:false,layout:'orbit',currentId:null,transition:false,pan:{x:0,y:0,k:1},past:[],future:[],dragHappened:false};
const byId=id=>state.nodes.find(n=>n.id===id)||null;
const kids=id=>state.nodes.filter(n=>n.parentId===id);
const id=()=>globalThis.crypto?.randomUUID?.()||'bm-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
const btn=(text,cls,fn)=>{const e=el('button',cls,text);e.type='button';e.addEventListener('click',fn);return e};
const $=id=>document.getElementById(id);
const refs={world:$('world'),intro:$('intro'),crumbs:$('crumbs'),overlay:$('overlay-root'),toast:$('toast'),motion:$('motion-button'),save:$('save-status')};
let toastTimer=null,canvas=null,viewport=null,svg=null,display=new Map(),press=null,panPress=null,portalBusy=false;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches&&!state.motionOverride;
function normalHex(x){return /^#[\da-f]{6}$/i.test(x)?x.toLowerCase():'#9bb5ff'}
function scrub(raw){
 if(!raw||!Array.isArray(raw.nodes))return;
 const all=raw.nodes.slice(0,5000).filter(n=>n&&typeof n.id==='string'&&n.id.length<160&&typeof n.title==='string');
 const seen=new Set();const clean=[];
 for(const n of all){if(seen.has(n.id))continue;seen.add(n.id);clean.push({id:n.id,parentId:typeof n.parentId==='string'?n.parentId:null,title:n.title.slice(0,100)||'Untitled',color:normalHex(n.color),description:String(n.description||'').slice(0,2000),size:Number.isFinite(n.size)?Math.max(.7,Math.min(1.4,n.size)):1,x:Number.isFinite(n.x)?Math.max(-6000,Math.min(6000,n.x)):null,y:Number.isFinite(n.y)?Math.max(-6000,Math.min(6000,n.y)):null})}
 const ids=new Set(clean.map(n=>n.id));for(const n of clean){if(n.parentId===n.id||!ids.has(n.parentId))n.parentId=null}
 // Break cycles from malformed backups, even though Stage 2 never deliberately creates them.
 for(const n of clean){const chain=new Set([n.id]);let p=n.parentId;while(p){if(chain.has(p)){n.parentId=null;break}chain.add(p);p=clean.find(x=>x.id===p)?.parentId||null}}
 state.nodes=clean;
 state.subnodes=Array.isArray(raw.subnodes)?raw.subnodes.filter(x=>x&&typeof x.id==='string'&&typeof x.ownerId==='string'&&ids.has(x.ownerId)).slice(0,5000).map(x=>({id:x.id.slice(0,160),ownerId:x.ownerId,title:String(x.title||'Details').slice(0,100),body:String(x.body||'').slice(0,500000)})):[];
 state.notes=(raw.notes&&typeof raw.notes==='object'&&!Array.isArray(raw.notes))?Object.fromEntries(Object.entries(raw.notes).filter(([k,v])=>ids.has(k)&&typeof v==='string').map(([k,v])=>[k,v.slice(0,500000)])):{};
 state.links=Array.isArray(raw.links)?raw.links.filter(l=>l&&typeof l.id==='string'&&ids.has(l.from)&&ids.has(l.to)&&l.from!==l.to).slice(0,20000).map(l=>({id:l.id,from:l.from,to:l.to,label:String(l.label||'').slice(0,90),color:normalHex(l.color)})):[];
 state.motion=raw.motion!==false;state.motionOverride=raw.motionOverride===true;state.homeStatic=raw.homeStatic===true;state.layout=['orbit','grid','free'].includes(raw.layout)?raw.layout:'orbit';
}
function load(){
 try{
  const existing=localStorage.getItem(KEY);
  if(existing){scrub(JSON.parse(existing));return}
  // Import a COPY of the assistant Stage 1 data, only once; never overwrite its storage key.
  const earlier=localStorage.getItem(STAGE1_KEY);
  if(earlier){
   const old=JSON.parse(earlier);
   if(Array.isArray(old.nodes)&&old.nodes.length){
    scrub(old);
    if(persist())refs.save.textContent='Previous mobile-layout ideas copied into Stage 5';
   }
  }
 }catch(e){refs.save.textContent='Storage unavailable — changes may not persist';console.warn(e)}
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:5,nodes:state.nodes,notes:state.notes,subnodes:state.subnodes,links:state.links,motion:state.motion,motionOverride:state.motionOverride,homeStatic:state.homeStatic,layout:state.layout}));refs.save.textContent='Saved on this device';return true}catch(e){console.error(e);refs.save.textContent='Save failed — storage unavailable';toast('Could not save to this browser');return false}}

/* Stage 4: non-destructive backups and deliberate restores.
   This app uses its own localStorage key and imports a COPY of Stage 3 once. */
const ROLLBACK_KEY='bubble-mind-stage5-pre-restore-v1';
let deferredInstall=null;
const collectData=()=>({version:5,nodes:state.nodes,notes:state.notes,subnodes:state.subnodes,links:state.links,
 motion:state.motion,motionOverride:state.motionOverride,homeStatic:state.homeStatic,layout:state.layout});
const safeName=()=>new Date().toISOString().replace(/[:.]/g,'-');
function saveDownload(filename,content,mime){
 const blob=new Blob([content],{type:mime});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=filename;
 document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function backupJSONString(){
 return JSON.stringify({format:'bubble-mind-backup',formatVersion:1,
  exportedAt:new Date().toISOString(),source:'stage5',data:collectData()},null,2);
}
function exportJSON(){saveDownload('bubble-mind-backup-'+safeName()+'.json',backupJSONString(),'application/json;charset=utf-8');toast('JSON backup prepared — check downloads')}
function mdSafe(v){return String(v||'').replace(/[\r\n]+/g,' ').replace(/([\\*_{}\[\]<>#+.!|])/g,'\\$1')}
function exportMarkdown(){
 const lines=['# Bubble Mind — ideas','', 'Exported '+new Date().toLocaleString(), ''];
 const children=new Map();
 for(const n of state.nodes){const key=n.parentId||'';if(!children.has(key))children.set(key,[]);children.get(key).push(n)}
 const visited=new Set();
 function walk(parent,depth){
  if(depth>50)return;
  for(const n of children.get(parent)||[]){
   if(visited.has(n.id))continue;visited.add(n.id);
   lines.push('  '.repeat(depth)+'- **'+mdSafe(n.title)+'**');
   if(n.description)lines.push('  '.repeat(depth+1)+mdSafe(n.description));
   if(state.notes[n.id]){lines.push('','  '.repeat(depth+1)+'Notes:', '');for(const line of state.notes[n.id].split(/\r?\n/))lines.push('  '.repeat(depth+1)+line);lines.push('')}
   for(const sub of state.subnodes.filter(x=>x.ownerId===n.id)){lines.push('  '.repeat(depth+1)+'- Sub-node: **'+mdSafe(sub.title)+'**');for(const line of sub.body.split(/\r?\n/))lines.push('  '.repeat(depth+2)+line);lines.push('')}
   walk(n.id,depth+1);
  }
 }
 walk('',0);
 for(const n of state.nodes)if(!visited.has(n.id))walk(n.parentId||'',0);
 saveDownload('bubble-mind-outline-'+safeName()+'.md',lines.join('\n'),'text/markdown;charset=utf-8');
 toast('Markdown outline prepared');
}
function exportCSV(){
 const by=new Map(state.nodes.map(n=>[n.id,n]));
 const path=n=>{let p=n,titles=[],seen=new Set();while(p&&!seen.has(p.id)){seen.add(p.id);titles.unshift(p.title);p=by.get(p.parentId)}return titles.join(' > ')};
 const cell=value=>{
  const plain=String(value??'');
  const safe=/^[\s]*[=+\-@\t\r]/.test(plain)?"'"+plain:plain;
  return '"'+safe.replace(/"/g,'""')+'"';
 };
 const rows=[['id','parent_id','title','path','description','notes','color','size','x','y'].map(cell).join(',')];
 for(const n of state.nodes)rows.push([n.id,n.parentId||'',n.title,path(n),n.description,[state.notes[n.id]||'',...state.subnodes.filter(x=>x.ownerId===n.id).map(x=>'Sub-node: '+x.title+'\n'+x.body)].filter(Boolean).join('\n\n'),n.color,n.size,n.x??'',n.y??''].map(cell).join(','));
 saveDownload('bubble-mind-ideas-'+safeName()+'.csv','\uFEFF'+rows.join('\r\n'),'text/csv;charset=utf-8');
 toast('CSV export prepared');
}
function checkedImport(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Backup must be a JSON object.');
 const data=raw.format==='bubble-mind-backup'?raw.data:raw;
 if(raw.format&&raw.format!=='bubble-mind-backup')throw Error('Unrecognized backup format.');
 if(raw.format==='bubble-mind-backup'&&raw.formatVersion!==1)throw Error('Unsupported backup version.');
 if(!data||typeof data!=='object'||!Array.isArray(data.nodes))throw Error('No valid ideas array found.');
 if(data.nodes.length>5000)throw Error('Backup exceeds the 5,000 bubble safety limit.');
 if(data.links!==undefined&&!Array.isArray(data.links))throw Error('Connections must be an array.');
 if(data.links?.length>20000)throw Error('Too many connections.');
 if(data.notes!==undefined&&(data.notes===null||typeof data.notes!=='object'||Array.isArray(data.notes)))throw Error('Notes must be an object.');
 const ids=new Set();
 for(const n of data.nodes){
  if(!n||typeof n.id!=='string'||!n.id||n.id.length>=160||typeof n.title!=='string')throw Error('Invalid bubble record.');
  if(ids.has(n.id))throw Error('Duplicate bubble ID: '+n.id.slice(0,40));
  ids.add(n.id);
 }
 for(const [key,value] of Object.entries(data.notes||{})){
  if(typeof value!=='string')throw Error('Invalid note content.');
  if(value.length>500000)throw Error('An individual note exceeds its safety limit.');
 }
 for(const l of data.links||[]){
  if(!l||typeof l.from!=='string'||typeof l.to!=='string'||typeof l.id!=='string')throw Error('Invalid connection record.');
 }
 return {nodes:data.nodes,links:data.links||[],notes:data.notes||{},subnodes:Array.isArray(data.subnodes)?data.subnodes:[],
  motion:data.motion,motionOverride:data.motionOverride,homeStatic:data.homeStatic,layout:data.layout};
}
function mergeImported(incoming){
 const map=new Map(incoming.nodes.map(n=>[n.id,id()]));
 for(const n of incoming.nodes){
  state.nodes.push({...n,id:map.get(n.id),
   parentId:map.get(n.parentId)||null});
 }
 for(const [oldId,note] of Object.entries(incoming.notes)){
  if(map.has(oldId))state.notes[map.get(oldId)]=note;
 }
 for(const sub of incoming.subnodes||[]){if(map.has(sub.ownerId))state.subnodes.push({...sub,id:id(),ownerId:map.get(sub.ownerId)})}
 for(const link of incoming.links){
  const from=map.get(link.from),to=map.get(link.to);
  if(from&&to&&from!==to)state.links.push({...link,id:id(),from,to});
 }
}
function restoreBackupData(incoming,mode){
 // Stage 4 keeps its own rollback snapshot. Never edit Stage 3 or original keys.
 const current=JSON.stringify(collectData());
 if(!localStorage.getItem(KEY))persist();
 localStorage.setItem(ROLLBACK_KEY,current);
 if(mode==='merge'){
  if(state.nodes.length+incoming.nodes.length>5000)throw Error('Merge exceeds 5,000 bubbles.');
  mergeImported(incoming);
  const combined=collectData();
  scrub(combined); // Sanitization and relationship cycle checks
 }else{
  scrub(incoming);
 }
 state.currentId=null;state.pan={x:0,y:0,k:1};state.past=[];state.future=[];
 if(!persist()){
  scrub(JSON.parse(current));persist();throw Error('Insufficient browser storage; original project restored.');
 }
 render();
}
function openBackupManager(){
 dialog('Backups, exports & installation','Your ideas stay on this device unless you export a file. Stage 5 uses separate storage; your completed stages and original app are not changed.',d=>{
  const section=(heading,description)=>{const wrap=el('section','stage4-section');wrap.append(el('h3','',heading),el('p','stage4-muted',description));d.append(wrap);return wrap};
  const stats=el('div','stage4-stats',state.nodes.length+' bubbles · '+Object.keys(state.notes).length+' notes · '+state.links.length+' connections');d.append(stats);
  const backup=section('Download your work','JSON is the complete recoverable backup. Markdown and CSV are readable exports, not restore files.');
  const actions=el('div','stage4-actions');
  actions.append(btn('Download JSON backup','soft-button',exportJSON),btn('Export Markdown','soft-button',exportMarkdown),btn('Export CSV','soft-button',exportCSV));
  backup.append(actions);
  const restore=section('Import or restore','Choose a JSON backup file and review it before making changes. Replacing creates a recovery copy in this browser.');
  const file=el('input','stage4-file');file.type='file';file.accept='.json,application/json';
  file.setAttribute('aria-label','Choose a Bubble Mind JSON backup');restore.append(file);
  const preview=el('p','stage4-muted','No file selected.');restore.append(preview);
  const options=el('div','stage4-actions');
  const mode=el('select','stage4-select');
  for(const [value,name] of [['merge','Add imported bubbles (keep existing)'],['replace','Replace Stage 4 ideas (with recovery copy)']]){const o=el('option','',name);o.value=value;mode.append(o)}
  mode.setAttribute('aria-label','Choose how to restore');
  const confirm=el('label','stage4-confirm');
  const checkbox=el('input');checkbox.type='checkbox';
  confirm.append(checkbox,document.createTextNode(' I understand this changes Stage 4 data.'));
  const apply=btn('Import selected backup','soft-button',()=>{});
  apply.disabled=true;
  options.append(mode,confirm,apply);restore.append(options);
  let imported=null;
  file.addEventListener('change',async()=>{
   imported=null;checkbox.checked=false;apply.disabled=true;
   const selected=file.files?.[0];if(!selected){preview.textContent='No file selected.';return}
   if(selected.size>40*1024*1024){preview.textContent='File is larger than 40 MB; not imported.';return}
   try{
    const data=JSON.parse(await selected.text());
    imported=checkedImport(data);
    preview.textContent='Checked: '+imported.nodes.length+' bubbles, '+Object.keys(imported.notes).length+' notes, '+imported.links.length+' connections. Select how to import, then confirm.';
    apply.disabled=false;
   }catch(err){preview.textContent='Cannot import: '+err.message}
  });
  apply.addEventListener('click',()=>{
   if(!imported||!checkbox.checked){toast('Check the confirmation box first');return}
   // Keep a local safety snapshot before any mutation, including merge.
   try{
    restoreBackupData(imported,mode.value);
    close();toast('Backup '+(mode.value==='merge'?'merged':'restored')+' into Stage 4');
   }catch(err){preview.textContent='Import failed: '+err.message;toast('Import failed')}
  });
  const recovery=section('Recovery','If a restore does not look right, recover the Stage 4 copy made just before the latest import.');
  const rollback=btn('Recover previous Stage 4 data','soft-button',()=>{
   const raw=localStorage.getItem(ROLLBACK_KEY);
   if(!raw)return toast('No recovery copy found');
   if(!window.confirm('Replace the current Stage 4 ideas with the previous recovery copy?'))return;
   try{
    const valid=checkedImport(JSON.parse(raw));
    const current=JSON.stringify(collectData());
    scrub(valid);state.currentId=null;state.past=[];state.future=[];
    if(!persist()){scrub(JSON.parse(current));persist();throw Error('Save failed')}
    close();render();toast('Previous Stage 4 data recovered');
   }catch(err){toast('Recovery failed: '+err.message)}
  });
  rollback.disabled=!localStorage.getItem(ROLLBACK_KEY);
  recovery.append(rollback);
  const install=section('Install Bubble Mind','Installation places an app shortcut on this device. Data does not automatically sync between devices. The page is available offline after the app has been opened online.');
  const installButton=btn('Install app','soft-button',async()=>{
   if(!deferredInstall){toast('Use your browser menu → Install app / Add to Home Screen');return}
   const prompt=deferredInstall;deferredInstall=null;try{await prompt.prompt();await prompt.userChoice}catch(_){}
  });
  install.append(installButton,el('p','stage4-muted','On Android: browser menu → Add to Home screen. On PC: look for Install app in your browser menu. On iPhone: Safari Share → Add to Home Screen.'));
 });
}

let activeNote=null;
function snapshot(){return JSON.stringify({nodes:state.nodes,notes:state.notes,subnodes:state.subnodes,links:state.links,motion:state.motion,motionOverride:state.motionOverride,homeStatic:state.homeStatic,layout:state.layout})}
function record(){state.past.push(snapshot());if(state.past.length>45)state.past.shift();state.future=[]}
function change(action,msg){record();try{action()}catch(e){const old=state.past.pop();Object.assign(state,JSON.parse(old));console.error(e);toast(e.message||'Operation failed');return false}const saved=persist();render();if(msg)toast(saved?msg:msg+' (not saved — check browser storage)');return true}
function undo(){if(!state.past.length)return toast('Nothing to undo');state.future.push(snapshot());Object.assign(state,JSON.parse(state.past.pop()));if(state.currentId&&!byId(state.currentId))state.currentId=null;persist();render();toast('Undone')}
function redo(){if(!state.future.length)return toast('Nothing to redo');state.past.push(snapshot());Object.assign(state,JSON.parse(state.future.pop()));if(state.currentId&&!byId(state.currentId))state.currentId=null;persist();render();toast('Redone')}
function toast(msg){clearTimeout(toastTimer);refs.toast.textContent=msg;refs.toast.classList.add('visible');toastTimer=setTimeout(()=>refs.toast.classList.remove('visible'),2900)}
function close(){refs.overlay.replaceChildren();document.body.classList.remove('dialog-open')}
function dialog(title,sub,build){close();const backdrop=el('div','overlay'),d=el('div','dialog');d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.append(el('h2','',title));if(sub)d.append(el('p','dialog-sub',sub));build(d);backdrop.append(d);refs.overlay.append(backdrop);document.body.classList.add('dialog-open');backdrop.addEventListener('pointerdown',e=>{if(e.target===backdrop)close()});d.querySelector('input,select,textarea,button')?.focus()}
function field(label,value='',kind='text'){const box=el('div','modal-grid'),name=el('label','',label),input=el(kind==='select'?'select':kind==='textarea'?'textarea':'input');if(kind==='textarea')input.rows=3;else if(kind!=='select'){input.type=kind==='color'?'color':'text';if(kind==='text')input.maxLength=100;}input.value=value;box.append(name,input);name.htmlFor='';return{box,input}}

   const node=byId(id),slot=canvas.querySelector('.map-node[data-id="'+CSS.escape(id)+'"]');
   const seed=floatHash(id),initial=baseline.get(id);
   return{node,slot,initial,x:initial.x,y:initial.y,vx:0,vy:0,phase:(seed%628)/100,slow:(seed%7)/10,

 }
 const tick=now=>{
  if(!state.motion||reduced()||document.hidden){stopBubbleFloat();return}
  if(!floatStart)floatStart=now;
  const t=(now-floatStart)/2000;
  for(const item of homeItemsSoft){
   if(!item.el.isConnected)continue;
   const x=25*Math.sin(t*(item.speed*1.8)+item.phase),y=32*Math.sin(t*(item.speed*1.45)+item.phase*1.23);
   item.el.style.translate=x.toFixed(1)+'px '+y.toFixed(1)+'px';
  }
  if(homeScene&&!state.homeStatic&&homeItems.length&&now-homeFrameTime>=30){
   const dt=Math.min(.05,(now-homeFrameTime||33)/1000),speed=.5;
   homeFrameTime=now;
   // A spatial grid limits collision checks when the home contains hundreds of bubbles.
   const cellSize=240,cells=new Map();
   for(const o of homeItems){
    const cellX=Math.floor(o.x/cellSize),cellY=Math.floor(o.y/cellSize);
    const key=cellX+','+cellY;
    if(!cells.has(key))cells.set(key,[]);
    cells.get(key).push(o);
   }
   const maxPerStep=1.05; // about 30px/sec at the 30fps update target
   for(const item of homeItems){
    const s=item.seed;
    const a=item.phase;
    // Each bubble has an independent, slowly wandering destination, not a tiny home-slot bob.
    const goalX=HOME_SIZE/2+Math.sin(t*(.052+(s%11)*.006)+a)*((HOME_SIZE/2)-item.r-HOME_PAD);
    const goalY=HOME_SIZE/2+Math.cos(t*(.046+(s%13)*.006)+a*1.3)*((HOME_SIZE/2)-item.r-HOME_PAD);
    let dx=goalX-item.x,dy=goalY-item.y,mag=Math.hypot(dx,dy)||1;
    let vx=dx/mag*.96,vy=dy/mag*.96;
    // Gently avoid near neighbours, without sharp collision impulses.
    const gx=Math.floor(item.x/cellSize),gy=Math.floor(item.y/cellSize);
    let avx=0,avy=0;
    for(let xx=-1;xx<=1;xx++)for(let yy=-1;yy<=1;yy++){
     const neighbours=cells.get((gx+xx)+','+(gy+yy))||[];
     for(const other of neighbours){
      if(other===item)continue;
      let ax=item.x-other.x,ay=item.y-other.y,dist=Math.hypot(ax,ay);
      const near=item.r+other.r+18;
      if(dist<near+48){
       if(dist<.01){const angle=item.phase-other.phase+1;ax=Math.cos(angle);ay=Math.sin(angle);dist=1}
       const weight=Math.max(0,(near+48-dist)/(near+48));
       avx+=ax/dist*weight;avy+=ay/dist*weight;
      }
     }
    }
    vx+=Math.max(-2,Math.min(2,avx))*.95;
    vy+=Math.max(-2,Math.min(2,avy))*.95;
    const vm=Math.hypot(vx,vy)||1;
    vx=vx/vm*maxPerStep;vy=vy/vm*maxPerStep;
    item.vx=item.vx*.93+vx*.07;item.vy=item.vy*.93+vy*.07;
    item.x=Math.min(HOME_SIZE-item.r-HOME_PAD,Math.max(item.r+HOME_PAD,item.x+item.vx));
    item.y=Math.min(HOME_SIZE-item.r-HOME_PAD,Math.max(item.r+HOME_PAD,item.y+item.vy));
    item.el.style.transform='translate('+(item.x-item.r).toFixed(2)+'px,'+(item.y-item.r).toFixed(2)+'px)';
    item.el.style.left='0px';item.el.style.top='0px';
   }
  }
  if(floatMap){
   const fm=floatMap,items=fm.items;
   const centre=byId(state.currentId),centreRadius=centre?bubbleDiameter(centre,'centre')/2:77;
   // Parent gently explores the available space. Children follow its motion
   // but also keep their own independent tether drift.
   const roomX=Math.max(0,viewport.clientWidth/(state.pan.k||1)/2-centreRadius-26);
   const roomY=Math.max(0,viewport.clientHeight/(state.pan.k||1)/2-centreRadius-26);
   const cx=Math.sin(t*.34+.45)*Math.min(38,roomX*.56)+Math.sin(t*.19+1.6)*Math.min(13,roomX*.18);
   const cy=Math.cos(t*.29+.8)*Math.min(31,roomY*.56)+Math.sin(t*.23+.4)*Math.min(12,roomY*.18);
   fm.centerPos={x:cx,y:cy};
   if(fm.centerEl)fm.centerEl.style.translate=cx.toFixed(1)+'px '+cy.toFixed(1)+'px';
   const w=viewport.clientWidth/(state.pan.k||1),h=viewport.clientHeight/(state.pan.k||1);
   const left=-w/2-state.pan.x/(state.pan.k||1),right=w/2-state.pan.x/(state.pan.k||1);
   const top=-h/2-state.pan.y/(state.pan.k||1),bottom=h/2-state.pan.y/(state.pan.k||1);
   // Crowded maps need smaller, slower wandering instead of stronger collisions.
   // Every positional change is limited per frame, including collision adjustments.
   const density=Math.min(1,Math.sqrt(7/Math.max(items.length,7)));
   const speedLimit=(1.5*density+.45)*.5;
   const targetLimit=155*density;
   const candidates=items.map(item=>{
    const a=item.phase,slow=item.slow;
    const wander=item.orbit*density;
    const tx=item.initial.x+cx
      +Math.sin(t*(.54+slow*.18)+a)*wander
      +Math.sin(t*.91+a*1.73)*22*density;
    const ty=item.initial.y+cy
      +Math.cos(t*(.42+slow*.16)+a*1.29)*wander*.82

    return {item,x:item.x+vx*cap,y:item.y+vy*cap};
   });
   // Soft local separation: no hard teleporting bubbles on collision.
   // Each neighbour contributes only a small bounded correction to the target.
   const pushes=new Array(candidates.length).fill(null).map(()=>({x:0,y:0}));
   for(let i=0;i<candidates.length;i++)for(let j=i+1;j<candidates.length;j++){
    const a=candidates[i],b=candidates[j];
    const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.0001;
    const ideal=a.item.r+b.item.r+12;
    if(dist>=ideal)continue;
    const overlap=Math.min(ideal-dist,ideal*.35);
    const force=Math.min(.55,overlap*.013);
    // For coincident bubbles, use a stable angle instead of dividing by near zero.
    const angle=(i*1.67+j*2.39);
    const nx=dist<.01?Math.cos(angle):dx/dist;
    const ny=dist<.01?Math.sin(angle):dy/dist;
    pushes[i].x-=nx*force;pushes[i].y-=ny*force;
    pushes[j].x+=nx*force;pushes[j].y+=ny*force;
   }
   for(let i=0;i<candidates.length;i++){
    const {item}=candidates[i],proposed=candidates[i];
    let x=proposed.x+Math.max(-.8,Math.min(.8,pushes[i].x));
    let y=proposed.y+Math.max(-.8,Math.min(.8,pushes[i].y));
    // Use a soft tether and parent avoidance; don't snap to either boundary.
    const anchorX=item.initial.x+cx,anchorY=item.initial.y+cy;
    const tetherDist=Math.hypot(x-anchorX,y-anchorY);
    if(tetherDist>targetLimit&&tetherDist>0){
      const excess=Math.min(.6,(tetherDist-targetLimit)*.035);
      x-=(x-anchorX)/tetherDist*excess;
      y-=(y-anchorY)/tetherDist*excess;
    }
    const parentDx=x-cx,parentDy=y-cy,parentDist=Math.hypot(parentDx,parentDy);
    const safe=centreRadius+item.r+18;
    if(parentDist<safe){
      const angle=item.phase+i*1.38;
      const nx=parentDist>.01?parentDx/parentDist:Math.cos(angle);
      const ny=parentDist>.01?parentDy/parentDist:Math.sin(angle);
      const avoid=Math.min(.85,(safe-parentDist)*.026);
      x+=nx*avoid;y+=ny*avoid;
    }
    // Keep currently visible nodes inside the view, without sudden snapping.
    const margin=item.r+12;
    if(item.initial.x>=left+margin&&item.initial.x<=right-margin){
      if(x<left+margin)x+=Math.min(.8,(left+margin-x)*.05);
      if(x>right-margin)x-=Math.min(.8,(x-(right-margin))*.05);
    }
    if(item.initial.y>=top+margin&&item.initial.y<=bottom-margin){
      if(y<top+margin)y+=Math.min(.8,(top+margin-y)*.05);
      if(y>bottom-margin)y-=Math.min(.8,(y-(bottom-margin))*.05);
    }
    const stepX=x-item.x,stepY=y-item.y,step=Math.hypot(stepX,stepY);
    const maxStep=speedLimit;
    if(step>maxStep){x=item.x+stepX/step*maxStep;y=item.y+stepY/step*maxStep}
    item.vx=(x-item.x)*.85;
    item.vy=(y-item.y)*.85;
    item.x=x;item.y=y;
   }
   for(const item of items){
    item.slot.style.translate=(item.x-item.initial.x).toFixed(1)+'px '+(item.y-item.initial.y).toFixed(1)+'px';
    display.set(item.node.id,{x:item.x,y:item.y});
   }
   updateMapLinks();
  }
  floatFrame=requestAnimationFrame(tick);
 };
